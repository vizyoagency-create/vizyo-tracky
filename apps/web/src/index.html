    <!--
      Theme initial : lu depuis localStorage si l'user a deja choisi, sinon
      derive de prefers-color-scheme. Defini AVANT le rendu du splash et de
      l'app pour eviter tout flash de theme. Le ThemeService persiste sa
      valeur dans la meme cle apres bootstrap pour rester en sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vizyo-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* keep default 'dark' */ }
      })();

      // Detection iOS PWA standalone : pose body.ios-pwa pour les CSS overrides
      // qui bumpent texte + tap targets afin que iPhone PWA ait la meme densite
      // visuelle que Chrome Android PWA (iOS Safari rend plus "browser-like"
      // par defaut).
      // Le check matchMedia se fait DOM-ready car body n'existe pas encore ici.
      (function () {
        function applyIosPwaClass() {
          try {
            var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent)
                     || (navigator.userAgent.indexOf('Mac') >= 0 && 'ontouchend' in document);
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                            || window.navigator.standalone === true;
            if (isIos && isStandalone) {
              document.body.classList.add('ios-pwa');
            }
          } catch (e) { /* noop */ }
        }
        if (document.body) {
          applyIosPwaClass();
        } else {
          document.addEventListener('DOMContentLoaded', applyIosPwaClass);
        }
      })();
    </script>

    <!--
      Splash "in-DOM" : couvre tous les OS (Android, iOS, desktop standalone) en
      affichant le logo + nom + halo tracky avant que le bundle Angular n'hydrate.
      Style inline pour zero FOUC. Fade-out declenche par main.ts apres bootstrap.

      Design : fond #0A0F0D (cohrerent manifest), halo radial tracky qui pulse
      doucement derriere le logo, titre en uppercase letterspaced, loader minimal
      qui n'apparait qu'apres 700ms (donc invisible si bootstrap rapide).
    -->
    <style>
      /* Splash : variantes dark (par defaut) / light pilotees par html[data-theme] */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        /* Dark par defaut (cohrent manifest + startup images iOS) */
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(16, 185, 129, 0.10), transparent 65%),
          #0A0F0D;
        color: #fff;
        opacity: 1;
        overflow: hidden;
        transition: opacity 480ms cubic-bezier(0.4, 0, 0.2, 1);
        /* Safe-area iOS pour ne pas coller a la notch */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        /* Optimisation rendering */
        will-change: opacity;
      }
      html[data-theme="light"] #app-splash {
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(5, 150, 105, 0.07), transparent 65%),
          #fafafa;
        color: #0A0F0D;
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .splash-stack {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        animation: splash-rise 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #app-splash .splash-glow {
        position: absolute;
        top: 18px;
        left: 50%;
        width: 220px;
        height: 220px;
        margin-left: -110px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.55), transparent 65%);
        filter: blur(48px);
        z-index: -1;
        pointer-events: none;
        animation: splash-pulse 2600ms ease-in-out infinite;
      }
      html[data-theme="light"] #app-splash .splash-glow {
        background: radial-gradient(circle, rgba(5, 150, 105, 0.32), transparent 65%);
      }
      #app-splash .splash-logo-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      #app-splash .splash-logo {
        width: 88px;
        height: auto;
        display: block;
        filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.35));
      }
      html[data-theme="light"] #app-splash .splash-logo {
        filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.10));
      }
      /* §1.1 — Logo qui se dessine : tracé du contour → remplissage → retrait du contour. */
      #app-splash .splash-logo path {
        fill-opacity: 0;
        stroke-opacity: 1;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: sp-draw 900ms 200ms both, sp-fill 520ms 820ms both, sp-sout 420ms 1180ms both;
      }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-fill { to { fill-opacity: 1; } }
      @keyframes sp-sout { to { stroke-opacity: 0.14; } }
      /* §1.2 — Anneau de halo qui se propage, centré sur le logo. */
      #app-splash .splash-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 74px;
        height: 74px;
        margin: -37px 0 0 -37px;
        border: 1px solid #10B981;
        border-radius: 50%;
        opacity: 0;
        z-index: -1;
        pointer-events: none;
        animation: sp-ring 2600ms ease-out infinite;
      }
      html[data-theme="light"] #app-splash .splash-ring { border-color: #059669; }
      @keyframes sp-ring {
        0% { transform: scale(0.55); opacity: 0.5; }
        100% { transform: scale(2.5); opacity: 0; }
      }
      #app-splash .splash-title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.82);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      html[data-theme="light"] #app-splash .splash-title {
        color: rgba(10, 15, 13, 0.72);
      }
      #app-splash .splash-loader {
        margin-top: 8px;
        width: 38px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 1px;
        overflow: hidden;
        position: relative;
        opacity: 0;
        /* Apparait seulement apres 700ms : si le bootstrap est rapide, pas de flash de loader */
        animation: splash-loader-in 480ms 700ms ease-out forwards;
      }
      html[data-theme="light"] #app-splash .splash-loader {
        background: rgba(10, 15, 13, 0.08);
      }
      #app-splash .splash-loader::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 60%;
        height: 100%;
        background: linear-gradient(to right, transparent, #10B981, transparent);
        animation: splash-loader-slide 1500ms ease-in-out infinite;
      }
      html[data-theme="light"] #app-splash .splash-loader::before {
        background: linear-gradient(to right, transparent, #059669, transparent);
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: scale(0.97); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.94); }
        50%      { opacity: 0.95; transform: scale(1.06); }
      }
      @keyframes splash-loader-in {
        to { opacity: 1; }
      }
      @keyframes splash-loader-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      /* Lock scroll pendant que le splash est visible */
      html.app-splash-active,
      html.app-splash-active body {
        overflow: hidden;
      }
      /* Respect prefers-reduced-motion : pas de pulse / slide */
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-stack,
        #app-splash .splash-glow,
        #app-splash .splash-loader,
        #app-splash .splash-loader::before,
        #app-splash .splash-logo path,
        #app-splash .splash-ring {
          animation: none;
        }
        #app-splash .splash-stack { opacity: 1; transform: none; }
        #app-splash .splash-loader { opacity: 1; }
        /* Logo en état final (rempli, contour discret) ; anneau masqué. */
        #app-splash .splash-logo path { fill-opacity: 1; stroke-opacity: 0.14; }
        #app-splash .splash-ring { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Chargement de Vizyo Tracky">
      <div class="splash-stack">
        <div class="splash-glow" aria-hidden="true"></div>
        <div class="splash-logo-wrap" aria-hidden="true">
          <span class="splash-ring"></span>
          <svg class="splash-logo" viewBox="0 0 283 290" fill="none" width="88" xmlns="http://www.w3.org/2000/svg">
            <path d="M180 11.6296C182 10.6295 193 -1.37044 224 0.129555C248.8 1.32956 267.333 22.2962 273.5 32.6296C289 59.6295 278 88.1296 277.5 90.1296C277.5 92 192 245.13 185 260.13C175.5 277.129 163.404 283.129 156 284.5C154 284.87 145.5 286.5 135 284.5C119.5 280.5 109 271 101.5 251L2 33.1296H37C55.8 33.9296 67.8333 48.1296 71.5 55.1296L137 192.63C146.6 215.429 161 220.13 166.5 220.13H166.672C171.787 220.131 182.708 220.135 189 214.63C197 207.63 202 201 203.5 188C205 175 190 148.63 185 141.63C163 105.13 158 97.6293 154.5 82.6296C151 67.6299 152.5 59.1296 153 53.6296C153.5 48.1296 156.5 40.6295 159.5 34.6296C162.5 28.6296 170.5 19.1295 180 11.6296ZM217 32.1296C198.775 32.1296 184 46.9042 184 65.1296C184 83.3548 198.775 98.1296 217 98.1296C235.225 98.1296 250 83.3548 250 65.1296C250 46.9042 235.225 32.1296 217 32.1296Z"
                  stroke="#10B981" stroke-width="4" stroke-linejoin="round" fill="url(#splash-grad)" pathLength="1" />
            <defs>
              <linearGradient id="splash-grad" x1="28" y1="280" x2="230" y2="79" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10E0A0" />
                <stop offset="1" stop-color="#047857" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="splash-title">Vizyo Tracky</h1>
        <div class="splash-loader" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // Active le lock de scroll des le parsing HTML (avant meme l'execution du bundle).
      document.documentElement.classList.add('app-splash-active');
    </script>
    <app-root></app-root>
  </body>
