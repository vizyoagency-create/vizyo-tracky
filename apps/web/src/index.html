    <!--
      Splash "in-DOM" : couvre tous les OS (Android, iOS, desktop standalone) en
      affichant le logo + spinner avant que le bundle Angular ne s'hydrate.
      Style inline pour zero FOUC. Le fade-out est declenche par main.ts apres
      bootstrap, sinon timeout fallback de 8s pour eviter de bloquer l'utilisateur.
    -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0A0F0D;
        color: #fff;
        opacity: 1;
        transition: opacity 280ms ease-out;
        /* Respecte les safe-areas iOS pour ne pas que le logo soit colle a la notch */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .splash-logo {
        width: 96px;
        height: auto;
        animation: splash-pop 520ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #app-splash .splash-spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(255, 255, 255, 0.12);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: splash-spin 720ms linear infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: translateY(8px) scale(0.92); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      /* Pendant que le splash est visible, on fige le scroll pour eviter qu'un scroll horizontal
         soit declenche par le contenu derriere */
      html.app-splash-active, html.app-splash-active body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Chargement de Vizyo Tracky">
      <img class="splash-logo" src="logos/svg/vizyo-tracky-icon-white.svg" alt="" aria-hidden="true" />
      <div class="splash-spinner" aria-hidden="true"></div>
    </div>
    <script>
      // Active le lock de scroll des le parsing HTML (avant meme l'execution du bundle).
      document.documentElement.classList.add('app-splash-active');
    </script>
    <app-root></app-root>
  </body>
