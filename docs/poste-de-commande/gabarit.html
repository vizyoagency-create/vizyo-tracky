<title>Poste de commande Tracky</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  /* ── Charte Tracky, jetons réels de l'application ── */
  --fond:      #F2F5F3;
  --surface:   #FFFFFF;
  --surface-2: #EAEFEB;
  --trait:     #DDE4E0;
  --trait-fort:#C3CEC8;
  --encre:     #0A1311;
  --encre-2:   #3D4A45;
  --encre-3:   #6B7873;
  --accent:      #0A9E6C;   /* accent lisible sur fond clair */
  --accent-vif:  #10E0A0;   /* le vert de marque */
  --accent-fond: #E4F6EE;
  --alerte:      #C0453F;
  --alerte-fond: #FBEAE9;
  --attente:     #96690B;
  --attente-fond:#FBF2DE;
  --calme:       #46617A;
  --calme-fond:  #E8EFF5;
  --ombre:   0 1px 2px rgb(10 19 17 / .05);
  --ombre-2: 0 1px 2px rgb(10 19 17 / .06), 0 8px 26px rgb(10 19 17 / .07);
  --titre: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --texte: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  --colonne: 1040px;
}
/* ⚠️ CETTE PAGE EST EN CLAIR, TOUJOURS — demande du propriétaire (10/09).
   Elle ne suit donc pas le thème de l'hôte : `color-scheme: light` le déclare, et le fond du
   corps est peint explicitement, sans quoi la page emprunterait le fond sombre de son hôte. */

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--fond); color: var(--encre-2);
  font-family: var(--texte); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; color: var(--encre); font-family: var(--titre); text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent-vif); outline-offset: 2px; border-radius: 5px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#racine { max-width: var(--colonne); margin: 0 auto; padding: 40px 26px 128px; display: flex; flex-direction: column; gap: 46px; }

/* ── En-tête ── */
.chapeau { display: flex; flex-direction: column; gap: 20px; }
.marque { display: flex; align-items: center; gap: 10px; }
.marque__logo {
  width: 26px; height: 27px; flex: none; background: var(--accent);
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
}
.marque__mot { font-family: var(--mono); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--encre-3); }
.titre { font-size: 36px; line-height: 1.05; font-weight: 700; letter-spacing: -.022em; }
.chapo { max-width: 62ch; font-size: 16px; color: var(--encre-2); }
.sommaire { display: flex; flex-wrap: wrap; gap: 7px; }
.sommaire a {
  display: inline-flex; align-items: center; gap: 7px; height: 31px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  color: var(--encre-2); font-size: 13px; text-decoration: none;
}
.sommaire a:hover { border-color: var(--trait-fort); color: var(--encre); }
.sommaire b { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--encre-3); }
.sommaire a.urgent b { color: var(--alerte); }

/* ── Bande de chiffres ──
   `auto-fit` plutôt qu'un nombre de colonnes fixe : la bande passe de quatre à deux puis à une
   toute seule, quelle que soit la largeur du volet. Un demi-écran ne coupe donc rien. */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 1px; background: var(--trait); border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
.chiffre { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 1px; }
.chiffre b { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--encre); letter-spacing: -.02em; line-height: 1.3; }
.chiffre span { font-size: 12.5px; color: var(--encre-3); }
.chiffre.est-alerte b { color: var(--alerte); }

/* ── Sections ── */
.section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 18px; }
.section__tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--trait); padding-bottom: 9px; }
.section__tete h2 { font-size: 21px; font-weight: 600; letter-spacing: -.012em; }
.compte { font-family: var(--mono); font-size: 11.5px; color: var(--encre-3); margin-left: auto; }
.intro { color: var(--encre-3); max-width: 74ch; font-size: 14px; }
.intro code, .ligne__note code, .fait__preuve code { font-family: var(--mono); font-size: .87em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--encre-2); }

/* ── Ce qui tourne tout seul ── */
.machines { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.machine { background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; padding: 15px 17px; display: flex; flex-direction: column; gap: 9px; }
.machine__nom { font-size: 14.5px; font-weight: 600; color: var(--encre); }
.machine__texte { font-size: 13.5px; color: var(--encre-3); }
.piste { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.piste__valeur { height: 100%; background: var(--accent); border-radius: 999px; }
.machine__pied { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--encre-3); }

.ligne__puce { color: var(--encre-3); font-size: 13px; align-self: start; margin-top: 2px; }
.ligne.est-lecture .ligne__quoi { font-weight: 400; }
/* ── Listes de tâches ── */
.liste { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--surface); }
.ligne { display: grid; grid-template-columns: 24px 62px minmax(0, 1fr) auto; gap: 5px 14px; align-items: baseline; padding: 13px 17px; border-top: 1px solid var(--trait); }
.ligne:first-child { border-top: 0; }
.ligne.est-faite { background: var(--surface-2); }
.ligne.est-faite .ligne__quoi { text-decoration: line-through; color: var(--encre-3); }
.ligne.est-faite .ligne__note { display: none; }
.case {
  width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--trait-fort);
  background: var(--surface); display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; color: transparent; align-self: start; margin-top: 1px;
  transition: background .12s, border-color .12s;
}
.case:hover { border-color: var(--encre-3); }
.case.est-cochee { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.ligne__ref { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--encre-3); align-self: start; margin-top: 3px; }
.ligne__quoi { font-size: 14.5px; color: var(--encre); font-weight: 500; }
.ligne__quoi .feu { color: var(--alerte); font-weight: 700; letter-spacing: -.04em; margin-right: 4px; }
.ligne__note { grid-column: 3 / -1; font-size: 13px; color: var(--encre-3); }
.ligne__chip { align-self: start; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; font-family: var(--mono); }
.chip--alerte { background: var(--alerte-fond); color: var(--alerte); }
.chip--attente { background: var(--attente-fond); color: var(--attente); }
.chip--accent { background: var(--accent-fond); color: var(--accent); }
.chip--calme { background: var(--calme-fond); color: var(--calme); }
.chip--neutre { background: var(--surface-2); color: var(--encre-3); }

/* ── Décisions ── */
.decisions { display: flex; flex-direction: column; gap: 11px; }
.decision { background: var(--surface); border: 1px solid var(--trait); border-left: 3px solid var(--attente); border-radius: 10px; padding: 15px 17px; display: flex; flex-direction: column; gap: 11px; }
.decision.est-tranchee { border-left-color: var(--accent); }
.decision__tete { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap; }
.decision__ref { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--attente); }
.decision.est-tranchee .decision__ref { color: var(--accent); }
.decision__sujet { font-size: 16px; font-weight: 600; flex: 1; min-width: 220px; }
.decision__texte { font-size: 13.5px; color: var(--encre-3); max-width: 76ch; }
.options { display: flex; gap: 7px; flex-wrap: wrap; }
.opt {
  display: inline-flex; align-items: center; gap: 8px; height: 33px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  color: var(--encre-2); font: inherit; font-size: 13.5px; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.opt:hover { border-color: var(--trait-fort); background: var(--surface-2); }
.opt .puce { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--trait-fort); flex: none; }
.opt.est-choisie { font-weight: 600; background: var(--accent-fond); border-color: var(--accent); color: var(--accent); }
.opt.est-choisie .puce { background: var(--accent); border-color: var(--accent); }
textarea {
  width: 100%; min-height: 52px; resize: vertical; padding: 9px 11px;
  border: 1px solid var(--trait); border-radius: 8px; background: var(--fond);
  color: var(--encre); font: inherit; font-size: 13.5px;
}
textarea::placeholder { color: var(--encre-3); }

/* ── Fait et prouvé ── */
.faits { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--surface); }
.fait { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 14px; padding: 13px 17px; border-top: 1px solid var(--trait); }
.fait:first-child { border-top: 0; }
.fait__date { font-family: var(--mono); font-size: 11.5px; color: var(--accent); font-weight: 500; margin-top: 2px; }
.fait__quoi { font-size: 14.5px; color: var(--encre); font-weight: 500; }
.fait__preuve { grid-column: 2; font-size: 13px; color: var(--encre-3); }

/* ── Où vit quoi ── */
.rangement { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.rangement__item { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 3px; }
.rangement__nom { font-family: var(--mono); font-size: 12.5px; color: var(--encre); font-weight: 500; word-break: break-word; }
.rangement__texte { font-size: 13px; color: var(--encre-3); }

/* ── Barre du bas ── */
.barre { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--trait); box-shadow: var(--ombre-2); z-index: 10; }
.barre__contenu { max-width: var(--colonne); margin: 0 auto; padding: 10px 26px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.avancee { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
.avancee__texte { font-size: 12.5px; color: var(--encre-3); display: flex; justify-content: space-between; gap: 10px; }
.sauvegarde { font-family: var(--mono); font-size: 12px; color: var(--encre-3); white-space: nowrap; }
.sauvegarde.est-ok { color: var(--accent); }
.sauvegarde.est-erreur { color: var(--alerte); }

/* ── Largeurs contraintes ──
   Le volet est souvent à demi-écran : ces paliers valent pour la LARGEUR DE LA PAGE, pas celle
   de l'appareil, donc ils tombent aussi sur un grand écran dont la fenêtre est réduite. */
@media (max-width: 900px) {
  #racine { padding: 32px 20px 132px; gap: 40px; }
  .titre { font-size: 32px; }
  /* La pastille de droite passe sous le texte plutôt que de le comprimer. */
  .ligne { grid-template-columns: 24px 58px minmax(0, 1fr); }
  .ligne__chip { grid-column: 3; margin-top: 2px; }
  .ligne__note { grid-column: 3; }
}
@media (max-width: 680px) {
  #racine { padding: 24px 14px 148px; gap: 34px; }
  .titre { font-size: 27px; }
  .chapo { font-size: 15px; }
  /* Deux colonnes : la case, puis tout le reste empilé. La référence et la pastille partagent
     la première ligne — chacune sur la sienne gaspillait deux hauteurs de texte par tâche. */
  .ligne { grid-template-columns: 24px minmax(0, 1fr); padding: 12px 14px; gap: 3px 12px; }
  .case, .ligne__puce { grid-row: 1; }
  .ligne__ref { grid-column: 2; grid-row: 1; margin-top: 0; }
  .ligne__chip { grid-column: 2; grid-row: 1; justify-self: end; margin-top: 0; }
  .ligne__quoi { grid-column: 2; grid-row: 2; }
  .ligne__note { grid-column: 2; grid-row: 3; }
  .fait { grid-template-columns: 1fr; padding: 12px 14px; }
  .fait__preuve { grid-column: 1; }
  .decision { padding: 14px 15px; }
  .decision__sujet { min-width: 0; font-size: 15.5px; }
  .machine, .rangement__item { padding: 13px 14px; }
  .section__tete h2 { font-size: 19px; }
  .compte { margin-left: 0; }
  .barre__contenu { padding: 9px 14px; gap: 10px; }
}
@media (max-width: 420px) {
  .opt { width: 100%; justify-content: center; }
  .sommaire a { font-size: 12.5px; padding: 0 11px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>

    h += '<button class="case' + (f ? ' est-cochee' : '') + '" data-act="tache" data-id="' + t.id + '" aria-pressed="' + f + '" aria-label="' + ech(t.quoi) + '">' + COCHE + '</button>';
    h += '<span class="ligne__ref">' + ech(t.id) + '</span>';
    h += '<span class="ligne__quoi">' + feux(t.feu || 0) + ech(t.quoi) + '</span>';
    h += '<span class="ligne__chip">' + (chip || '') + '</span>';
    if (t.note) h += '<p class="ligne__note">' + ech(t.note) + (t.ref && t.ref !== '—' ? ' <code>' + ech(t.ref) + '</code>' : '') + '</p>';
    h += '</div>';
    return h;
  }

  function rendre() {
    var h = '';

    /* ── En-tête ── */
    h += '<header class="chapeau">';
    h += '<div class="marque"><span class="marque__logo" style="--logo:url(&quot;' + LOGO + '&quot;)"></span><span class="marque__mot">Vizyo Tracky · supervision de production</span></div>';
    h += '<h1 class="titre">Poste de commande</h1>';
    h += '<p class="chapo">Ce qu’il reste à faire, qui peut le faire, et ce qui est déjà prouvé. Coché ici, c’est coché pour de bon : la page garde son état. Relevé du ' + RELEVE + '.</p>';
    h += '<nav class="sommaire" aria-label="Sections">'
      + '<a href="#toi" class="urgent">Ce qui t’attend <b id="nav-toi">' + totalToi() + '</b></a>'
      + '<a href="#moi">Ce que je code <b id="nav-moi">' + reste(MOI) + '</b></a>'
      + '<a href="#guette">On guette <b>' + GUETTE.length + '</b></a>'
      + '<a href="#vps">Côté VPS <b>28</b></a>'
      + '<a href="#faits">Fait et prouvé <b>' + FAITS.length + '</b></a>'
      + '</nav>';
    h += '<div class="chiffres">';
    CHIFFRES.forEach(function (c, i) {
      var v = i === 2 ? String(totalToi()) : c.v;
      h += '<div class="chiffre' + (c.alerte ? ' est-alerte' : '') + '"><b>' + ech(v) + '</b><span>' + ech(c.t) + '</span></div>';
    });
    h += '</div>';
    h += '</header>';

    /* ── Ce qui tourne tout seul ── */
    h += '<section class="section" id="machines"><div class="section__tete"><h2>Ce qui tourne tout seul</h2><span class="compte">aucune action</span></div>';
    h += '<div class="machines">';
    MACHINES.forEach(function (m) {
      h += '<article class="machine"><div class="machine__nom">' + ech(m.nom) + '</div><p class="machine__texte">' + ech(m.texte) + '</p>';
      if (m.total) {
        var pct = Math.round(m.fait / m.total * 100);
        h += '<div class="piste"><div class="piste__valeur" style="width:' + pct + '%"></div></div>';
        h += '<div class="machine__pied"><span>' + pct + ' % · ' + ech(m.pied) + '</span><span>' + ech(m.pied2) + '</span></div>';
      } else {
        h += '<div class="machine__pied"><span>' + ech(m.pied) + '</span><span>' + ech(m.pied2) + '</span></div>';
      }
      h += '</article>';
    });
    h += '</div></section>';

    /* ── Ce qui t'attend ── */
    h += '<section class="section" id="toi"><div class="section__tete"><h2>Ce qui t’attend</h2><span class="compte" id="compte-toi">' + reste(TOI) + ' gestes · ' + decisionsRestantes() + ' décisions</span></div>';
    h += '<p class="intro">Huit gestes que le code ne peut pas faire, dans l’ordre où ils débloquent le reste. Les triangles marquent ce qui bloque en amont.</p>';
    h += '<div class="liste">';
    TOI.forEach(function (t) { h += ligne(t, '<span class="chip chip--alerte">toi</span>'); });
    h += '</div>';

    h += '<p class="intro" style="margin-top:6px">Et deux questions courtes. Réponds ici : je lis la page.</p>';
    h += '<div class="decisions">';
    DECISIONS.forEach(function (d) {
      var r = etat.decisions[d.id] || {};
      h += '<article class="decision' + (r.choix ? ' est-tranchee' : '') + '">';
      h += '<div class="decision__tete"><span class="decision__ref">' + d.id + '</span><h3 class="decision__sujet">' + ech(d.sujet) + '</h3></div>';
      h += '<p class="decision__texte">' + ech(d.texte) + '</p>';
      h += '<div class="options">';
      d.options.forEach(function (o) {
        h += '<button class="opt' + (r.choix === o.v ? ' est-choisie' : '') + '" data-act="decision" data-id="' + d.id + '" data-val="' + o.v + '" aria-pressed="' + (r.choix === o.v) + '"><span class="puce"></span>' + ech(o.l) + '</button>';
      });
      h += '</div>';
      h += '<textarea data-act="note" data-id="' + d.id + '" aria-label="Votre réponse à ' + d.id + '" placeholder="Ou dis-moi autre chose">' + ech(r.note || '') + '</textarea>';
      h += '</article>';
    });
    h += '</div></section>';

    /* ── Ce que je code ── */
    h += '<section class="section" id="moi"><div class="section__tete"><h2>Ce que je peux coder</h2><span class="compte" id="compte-moi">' + reste(MOI) + ' sur ' + MOI.length + '</span></div>';
    h += '<p class="intro">Par ordre d’utilité. Dis-m’en un, je le prends.</p>';
    h += '<div class="liste">';
    MOI.forEach(function (t) { h += ligne(t, '<span class="chip chip--accent">à coder</span>'); });
    h += '</div></section>';

    /* ── On guette ── */
    h += '<section class="section" id="guette"><div class="section__tete"><h2>Ce qu’on guette</h2><span class="compte">rien à faire</span></div>';
    h += '<p class="intro">Quatre correctifs sont en ligne et attendent leur occasion de se prouver. La mesure tombe toute seule.</p>';
    h += '<div class="liste">';
    GUETTE.forEach(function (g) {
      h += '<div class="ligne est-lecture">';
      h += '<span class="ligne__puce" aria-hidden="true">◷</span>';
      h += '<span class="ligne__ref">' + ech(g.id) + '</span>';
      h += '<span class="ligne__quoi">' + ech(g.quoi) + '</span>';
      h += '<span class="ligne__chip"><span class="chip chip--calme">' + ech(g.quand) + '</span></span>';
      h += '</div>';
    });
    h += '</div></section>';

    /* ── VPS ── */
    h += '<section class="section" id="vps"><div class="section__tete"><h2>Côté VPS</h2><span class="compte">28 constats</span></div>';
    h += '<p class="intro">Presque tous des gestes d’infrastructure. Les quatre plus lourds :</p>';
    h += '<div class="liste">';
    VPS.forEach(function (v) {
      h += '<div class="ligne est-lecture">';
      h += '<span class="ligne__puce" aria-hidden="true">▪</span>';
      h += '<span class="ligne__ref">' + ech(v.id) + '</span>';
      h += '<span class="ligne__quoi">' + ech(v.quoi) + '</span>';
      h += '<span class="ligne__chip"><span class="chip chip--neutre">infra</span></span>';
      h += '</div>';
    });
    h += '</div></section>';

    /* ── Fait et prouvé ── */
    h += '<section class="section" id="faits"><div class="section__tete"><h2>Fait et prouvé</h2><span class=\"compte\">' + FAITS.length + ' racontés · ' + FAITS_CLOS + ' tâches closes</span></div>';
    h += '<p class="intro">« Prouvé » veut dire mesuré sur la production, pas déployé. Un correctif déployé qu’aucun événement n’exerce reste un correctif non prouvé.</p>';
    h += '<div class="faits">';
    FAITS.forEach(function (f) {
      h += '<div class="fait"><span class="fait__date">' + ech(f.d) + '</span><span class="fait__quoi">' + ech(f.quoi) + '</span><p class="fait__preuve">' + f.preuve + '</p></div>';
    });
    h += '</div></section>';

    /* ── Où vit quoi ── */
    h += '<section class="section" id="rangement"><div class="section__tete"><h2>Où vit quoi</h2></div>';
    h += '<p class="intro">Cette page est le résumé. La trace complète est dans le dépôt.</p>';
    h += '<div class="rangement">';
    RANGEMENT.forEach(function (r) {
      h += '<div class="rangement__item"><span class="rangement__nom">' + ech(r.nom) + '</span><span class="rangement__texte">' + ech(r.texte) + '</span></div>';
    });
    h += '</div></section>';

    racine.innerHTML = h;
    majBarre();
  }

  /* ── Barre du bas ── */
  function majBarre() {
    var total = TOI.length + DECISIONS.length + MOI.length;
    var fini = TOI.filter(function (t) { return faite(t.id); }).length
             + MOI.filter(function (t) { return faite(t.id); }).length
             + (DECISIONS.length - decisionsRestantes());
    var pct = total ? Math.round(fini / total * 100) : 0;
    var barre = document.getElementById('barre');
    if (!barre) {
      barre = document.createElement('div');
      barre.className = 'barre'; barre.id = 'barre';
      document.body.appendChild(barre);
    }
    barre.innerHTML = '<div class="barre__contenu">'
      + '<div class="avancee"><div class="avancee__texte"><span>' + fini + ' sur ' + total + ' traités</span><span class="mono">' + pct + ' %</span></div>'
      + '<div class="piste"><div class="piste__valeur" style="width:' + pct + '%"></div></div></div>'
      + '<span class="sauvegarde" id="sauvegarde">état gardé sur cet appareil</span>'
      + '</div>';
  }

  function dire(texte, classe) {
    var el = document.getElementById('sauvegarde');
    if (!el) return;
    el.textContent = texte;
    el.className = 'sauvegarde' + (classe ? ' ' + classe : '');
  }

  /* ── Enregistrement ── */
  function enregistrer() {
    etat.maj = new Date().toISOString();
    try { localStorage.setItem('tracky-poste', JSON.stringify(etat)); } catch (e) {}
    if (!artefact) { dire('état gardé sur cet appareil'); return; }
    dire('enregistrement…');
    clearTimeout(minuteur);
    minuteur = setTimeout(publier, 700);
  }

  function publier() {
    if (!artefact || enCours) return;
    enCours = true;
    var doc = document.documentElement.cloneNode(true);
    var bloc = doc.querySelector('#etat');
    if (bloc) bloc.textContent = JSON.stringify(etat);
    var barre = doc.querySelector('#barre');
    if (barre) barre.remove();
    var r = doc.querySelector('#racine');
    if (r) r.innerHTML = '';
    artefact.publish('<!doctype html>' + doc.outerHTML).then(function () {
      enCours = false;
      dire('enregistré pour tout le monde', 'est-ok');
    }).catch(function (err) {
      enCours = false;
      var code = err && err.code;
      if (code === 'conflict') { dire('une autre version a gagné', 'est-erreur'); return; }
      if (code === 'not_granted' || code === 'not_writer') { artefact = null; dire('état gardé sur cet appareil'); return; }
      dire('gardé ici seulement', 'est-erreur');
    });
  }

  /* ── Interactions ── */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.tagName === 'TEXTAREA') return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'tache') {
      etat.taches[id] = !etat.taches[id];
      rendre(); enregistrer();
    } else if (act === 'decision') {
      var d = decision(id), v = b.getAttribute('data-val');
      d.choix = d.choix === v ? '' : v;
      rendre(); enregistrer();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.tagName !== 'TEXTAREA' || t.getAttribute('data-act') !== 'note') return;
    decision(t.getAttribute('data-id')).note = t.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { enregistrer(); }, 900);
  });

  rendre();

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (a) {
      if (a) { artefact = a; dire('prêt — les coches sont partagées'); }
    }).catch(function () {});
  }
})();
</script>
