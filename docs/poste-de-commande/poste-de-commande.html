<title>Poste de commande Tracky</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  /* ── Charte Tracky, jetons réels de l'application ── */
  --fond:      #F2F5F3;
  --surface:   #FFFFFF;
  --surface-2: #EAEFEB;
  --trait:     #DDE4E0;
  --trait-fort:#C3CEC8;
  --encre:     #0A1311;
  --encre-2:   #3D4A45;
  --encre-3:   #6B7873;
  --accent:      #0A9E6C;   /* accent lisible sur fond clair */
  --accent-vif:  #10E0A0;   /* le vert de marque */
  --accent-fond: #E4F6EE;
  --alerte:      #C0453F;
  --alerte-fond: #FBEAE9;
  --attente:     #96690B;
  --attente-fond:#FBF2DE;
  --calme:       #46617A;
  --calme-fond:  #E8EFF5;
  --ombre:   0 1px 2px rgb(10 19 17 / .05);
  --ombre-2: 0 1px 2px rgb(10 19 17 / .06), 0 8px 26px rgb(10 19 17 / .07);
  --titre: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --texte: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  --colonne: 1040px;
}
/* ⚠️ CETTE PAGE EST EN CLAIR, TOUJOURS — demande du propriétaire (10/09).
   Elle ne suit donc pas le thème de l'hôte : `color-scheme: light` le déclare, et le fond du
   corps est peint explicitement, sans quoi la page emprunterait le fond sombre de son hôte. */

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--fond); color: var(--encre-2);
  font-family: var(--texte); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; color: var(--encre); font-family: var(--titre); text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent-vif); outline-offset: 2px; border-radius: 5px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#racine { max-width: var(--colonne); margin: 0 auto; padding: 40px 26px 128px; display: flex; flex-direction: column; gap: 46px; }

/* ── En-tête ── */
.chapeau { display: flex; flex-direction: column; gap: 20px; }
.marque { display: flex; align-items: center; gap: 10px; }
.marque__logo {
  width: 26px; height: 27px; flex: none; background: var(--accent);
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
}
.marque__mot { font-family: var(--mono); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--encre-3); }
.titre { font-size: 36px; line-height: 1.05; font-weight: 700; letter-spacing: -.022em; }
.chapo { max-width: 62ch; font-size: 16px; color: var(--encre-2); }
.sommaire { display: flex; flex-wrap: wrap; gap: 7px; }
.sommaire a {
  display: inline-flex; align-items: center; gap: 7px; height: 31px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  color: var(--encre-2); font-size: 13px; text-decoration: none;
}
.sommaire a:hover { border-color: var(--trait-fort); color: var(--encre); }
.sommaire b { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--encre-3); }
.sommaire a.urgent b { color: var(--alerte); }

/* ── Bande de chiffres ──
   `auto-fit` plutôt qu'un nombre de colonnes fixe : la bande passe de quatre à deux puis à une
   toute seule, quelle que soit la largeur du volet. Un demi-écran ne coupe donc rien. */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 1px; background: var(--trait); border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
.chiffre { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 1px; }
.chiffre b { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--encre); letter-spacing: -.02em; line-height: 1.3; }
.chiffre span { font-size: 12.5px; color: var(--encre-3); }
.chiffre.est-alerte b { color: var(--alerte); }

/* ── Sections ── */
.section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 18px; }
.section__tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--trait); padding-bottom: 9px; }
.section__tete h2 { font-size: 21px; font-weight: 600; letter-spacing: -.012em; }
.compte { font-family: var(--mono); font-size: 11.5px; color: var(--encre-3); margin-left: auto; }
.intro { color: var(--encre-3); max-width: 74ch; font-size: 14px; }
.intro code, .ligne__note code, .fait__preuve code { font-family: var(--mono); font-size: .87em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--encre-2); }

/* ── Ce qui tourne tout seul ── */
.machines { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.machine { background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; padding: 15px 17px; display: flex; flex-direction: column; gap: 9px; }
.machine__nom { font-size: 14.5px; font-weight: 600; color: var(--encre); }
.machine__texte { font-size: 13.5px; color: var(--encre-3); }
.piste { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.piste__valeur { height: 100%; background: var(--accent); border-radius: 999px; }
.machine__pied { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--encre-3); }

.ligne__puce { color: var(--encre-3); font-size: 13px; align-self: start; margin-top: 2px; }
.ligne.est-lecture .ligne__quoi { font-weight: 400; }
/* ── Listes de tâches ── */
.liste { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--surface); }
.ligne { display: grid; grid-template-columns: 24px 62px minmax(0, 1fr) auto; gap: 5px 14px; align-items: baseline; padding: 13px 17px; border-top: 1px solid var(--trait); }
.ligne:first-child { border-top: 0; }
.ligne.est-faite { background: var(--surface-2); }
.ligne.est-faite .ligne__quoi { text-decoration: line-through; color: var(--encre-3); }
.ligne.est-faite .ligne__note { display: none; }
.case {
  width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--trait-fort);
  background: var(--surface); display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; color: transparent; align-self: start; margin-top: 1px;
  transition: background .12s, border-color .12s;
}
.case:hover { border-color: var(--encre-3); }
.case.est-cochee { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.ligne__ref { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--encre-3); align-self: start; margin-top: 3px; }
.ligne__quoi { font-size: 14.5px; color: var(--encre); font-weight: 500; }
.ligne__quoi .feu { color: var(--alerte); font-weight: 700; letter-spacing: -.04em; margin-right: 4px; }
.ligne__note { grid-column: 3 / -1; font-size: 13px; color: var(--encre-3); }
.ligne__chip { align-self: start; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; font-family: var(--mono); }
.chip--alerte { background: var(--alerte-fond); color: var(--alerte); }
.chip--attente { background: var(--attente-fond); color: var(--attente); }
.chip--accent { background: var(--accent-fond); color: var(--accent); }
.chip--calme { background: var(--calme-fond); color: var(--calme); }
.chip--neutre { background: var(--surface-2); color: var(--encre-3); }

/* ── Décisions ── */
.decisions { display: flex; flex-direction: column; gap: 11px; }
.decision { background: var(--surface); border: 1px solid var(--trait); border-left: 3px solid var(--attente); border-radius: 10px; padding: 15px 17px; display: flex; flex-direction: column; gap: 11px; }
.decision.est-tranchee { border-left-color: var(--accent); }
.decision__tete { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap; }
.decision__ref { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--attente); }
.decision.est-tranchee .decision__ref { color: var(--accent); }
.decision__sujet { font-size: 16px; font-weight: 600; flex: 1; min-width: 220px; }
.decision__texte { font-size: 13.5px; color: var(--encre-3); max-width: 76ch; }
/* Une décision PRISE n'a plus de boutons : le choix devient une pastille dans l'en-tête, les
   mots du propriétaire une citation, et la suite donnée une ligne fléchée. La pastille peut
   porter une phrase entière — elle replie donc, contrairement aux autres pastilles. */
.decision--prise { gap: 8px; }
.decision--prise .chip { white-space: normal; height: auto; min-height: 22px; padding: 2px 9px; line-height: 1.35; }
.decision__note { font-size: 13.5px; color: var(--encre-2); font-style: italic; max-width: 76ch; }
.decision__suite { font-size: 13px; color: var(--encre-3); max-width: 76ch; }
.decision__suite::before { content: '→ '; color: var(--accent); font-weight: 600; }
.options { display: flex; gap: 7px; flex-wrap: wrap; }
.opt {
  display: inline-flex; align-items: center; gap: 8px; height: 33px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  color: var(--encre-2); font: inherit; font-size: 13.5px; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.opt:hover { border-color: var(--trait-fort); background: var(--surface-2); }
.opt .puce { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--trait-fort); flex: none; }
.opt.est-choisie { font-weight: 600; background: var(--accent-fond); border-color: var(--accent); color: var(--accent); }
.opt.est-choisie .puce { background: var(--accent); border-color: var(--accent); }
textarea {
  width: 100%; min-height: 52px; resize: vertical; padding: 9px 11px;
  border: 1px solid var(--trait); border-radius: 8px; background: var(--fond);
  color: var(--encre); font: inherit; font-size: 13.5px;
}
textarea::placeholder { color: var(--encre-3); }

/* ── Fait et prouvé ── */
.faits { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--surface); }
.fait { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 14px; padding: 13px 17px; border-top: 1px solid var(--trait); }
.fait:first-child { border-top: 0; }
.fait__date { font-family: var(--mono); font-size: 11.5px; color: var(--accent); font-weight: 500; margin-top: 2px; }
.fait__quoi { font-size: 14.5px; color: var(--encre); font-weight: 500; }
.fait__preuve { grid-column: 2; font-size: 13px; color: var(--encre-3); }

/* ── Où vit quoi ── */
.rangement { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.rangement__item { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 3px; }
.rangement__nom { font-family: var(--mono); font-size: 12.5px; color: var(--encre); font-weight: 500; word-break: break-word; }
.rangement__texte { font-size: 13px; color: var(--encre-3); }

/* ── Barre du bas ── */
.barre { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--trait); box-shadow: var(--ombre-2); z-index: 10; }
.barre__contenu { max-width: var(--colonne); margin: 0 auto; padding: 10px 26px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.avancee { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
.avancee__texte { font-size: 12.5px; color: var(--encre-3); display: flex; justify-content: space-between; gap: 10px; }
.sauvegarde { font-family: var(--mono); font-size: 12px; color: var(--encre-3); white-space: nowrap; }
.sauvegarde.est-ok { color: var(--accent); }
.sauvegarde.est-erreur { color: var(--alerte); }

/* ── Largeurs contraintes ──
   Le volet est souvent à demi-écran : ces paliers valent pour la LARGEUR DE LA PAGE, pas celle
   de l'appareil, donc ils tombent aussi sur un grand écran dont la fenêtre est réduite. */
@media (max-width: 900px) {
  #racine { padding: 32px 20px 132px; gap: 40px; }
  .titre { font-size: 32px; }
  /* La pastille de droite passe sous le texte plutôt que de le comprimer. */
  .ligne { grid-template-columns: 24px 58px minmax(0, 1fr); }
  .ligne__chip { grid-column: 3; margin-top: 2px; }
  .ligne__note { grid-column: 3; }
}
@media (max-width: 680px) {
  #racine { padding: 24px 14px 148px; gap: 34px; }
  .titre { font-size: 27px; }
  .chapo { font-size: 15px; }
  /* Deux colonnes : la case, puis tout le reste empilé. La référence et la pastille partagent
     la première ligne — chacune sur la sienne gaspillait deux hauteurs de texte par tâche. */
  .ligne { grid-template-columns: 24px minmax(0, 1fr); padding: 12px 14px; gap: 3px 12px; }
  .case, .ligne__puce { grid-row: 1; }
  .ligne__ref { grid-column: 2; grid-row: 1; margin-top: 0; }
  .ligne__chip { grid-column: 2; grid-row: 1; justify-self: end; margin-top: 0; }
  .ligne__quoi { grid-column: 2; grid-row: 2; }
  .ligne__note { grid-column: 2; grid-row: 3; }
  .fait { grid-template-columns: 1fr; padding: 12px 14px; }
  .fait__preuve { grid-column: 1; }
  .decision { padding: 14px 15px; }
  .decision__sujet { min-width: 0; font-size: 15.5px; }
  .machine, .rangement__item { padding: 13px 14px; }
  .section__tete h2 { font-size: 19px; }
  .compte { margin-left: 0; }
  .barre__contenu { padding: 9px 14px; gap: 10px; }
}
@media (max-width: 420px) {
  .opt { width: 100%; justify-content: center; }
  .sommaire a { font-size: 12.5px; padding: 0 11px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>

ations d exces de vitesse — qui doit les recevoir (D9)","note":"14 par jour et par super-admin, pour un produit calibre sur 2 a 3. Relever le seuil, ou restreindre les destinataires. LE SUJET A DEUX COTES depuis le 07/09 : les trajets les plus rapides sont sur A2R dont l alerte de vitesse est ETEINTE, pendant que les deux flottes armees restent sous leur seuil — la flotte qui roule le plus vite est exactement celle ou l alerte est eteinte, et regler le seuil sans regarder QUI est arme ne traiterait que la moitie bruyante. AU 10/09, un chiffre a ne pas mal lire : 52 remises sur 24 h dont 6 EN ECHEC, contre 2 la veille. Ce n est PAS une degradation — les echecs valent exactement deux fois le nombre de lignes critiques agents-locaux du jour (3 le 09/09 donnent 6, 1 le 08/09 donne 2, 3 le 06/09 donnent 6, 1 le 07/09 donne 2). Une valeur qui triple peut n etre que la fonction exacte d un autre compteur. 🔴 AU 13/09, A CORRIGER AVANT DE CALIBRER : un cinquieme des notifications d exces de vitesse est un DOUBLON (TRK-078, T30 — onze sur cinquante-cinq en quatorze jours, meme vehicule, meme instant d exces a la seconde, deux identites de trajet). Regler le seuil sans corriger la cle, c est regler la sensibilite d un instrument qui compte double. Les lignes des 10 et 11/09 : 15 a 18 notifications en 24 h par super-admin, dont 8 a 9 OVERSPEED. — INSTRUITE LE 13/09 AU SOIR : deux societes armees (cdef31 30 vehicules, mh cars 7), DEJA reglees a +40 km/h sur la limite et 130 km/h absolu (le defaut est +20). Sur quatorze jours : 55 alertes, 49 chez mh cars (jusqu a 142 km/h), 6 chez cdef31 ; 58 pour cent viennent du plafond absolu (130 a 142 km/h sur des routes a 110), 42 pour cent de la regle des +40 ; 22 pour cent etaient des doublons, que T30 supprime depuis le 13/09 — il en reste environ trois par jour. Les destinataires : l administrateur de mh cars recoit les siennes (7 a 8 par jour : sa flotte, son reglage), et les deux super-administrateurs recoivent TOUTES les flottes — 7 a 9 exces par jour, plus 5 a 11 notifications de la sentinelle des agents pendant la panne de la semaine (11 le 13/09 : huit CRITICAL d agents tues ou au plafond, trois causes communes — T36 et T31 les reduisent, et la cause « plafond » ne se rouvre plus sur un echec ancien depuis 13471c53). La saturation est donc celle des super-admins, pas celle du client ; admin@vizyoagency.com a d ailleurs choisi « tout recevoir, des info » dans ses preferences. Decision D9 posee : couper les exces pour les super-admins et garder les seuils (recommande), relever le plafond a 140, ou ne rien changer.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T5","ref":"TRK-062","feu":1,"quoi":"Autoriser la migration SENT_UNCONFIRMED","note":"Verifie absent de l artefact servi 8 fois (SENT_UNCONFIRMED : zero fichier dans dist/tracker-commands au 13/09). Les 2 commandes SMS atteignent 288,1 et 284,7 heures au 13/09, soit exactement 24,0 heures de plus par jour pour la 6e fois : elles ne se fermeront JAMAIS seules.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T9","ref":"—","feu":1,"quoi":"Declarer ou depanner GLA•KC•31 et FG-669-DQ — et LEVER la declaration des trois revenus","note":"Muets depuis 248 h (GLA•KC•31, depuis le 03/09 01:53) et 164 h (FG-669-DQ, depuis le 06/09 14:18) au 13/09, et NON declares : ils sortent du filtre gps_sans_fix par le bas. 🆕 ET L INVERSE LE 13/09 : trois vehicules DECLARES « boitier debranche » le 31/08 — FR-629-AD, FW-298-WV, FZ-731-YF (Retour LLD) — sont revenus le 11/09 et roulent (1 809 et 3 889 positions) avec TOUTES leurs alertes coupees, parce que la declaration n a pas ete levee. Un vol de FZ-731-YF aujourd hui ne produirait rien. Geste d ecran : lever la declaration sur les trois.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T1","ref":"TRK-071","feu":0,"quoi":"Recharger au moins UN des deux comptes IA","note":"Anthropic ET OpenAI sont vides. Le repli claude vers gpt est deploye, correct, et sans effet tant que c est vrai. Au 13/09 : Anthropic a sec depuis le 03/09 00:13, soit 250 heures et un 11e jour, dernier appel API reussi le 03/09 00:01 ; OpenAI constate vide le 05/09. 🔴 ET LE TROISIEME CANAL S EST REVELE PLAFONNE A SON TOUR : la CLI Claude du poste (executor local), sur laquelle tout le reste s etait replie, a atteint son plafond hebdomadaire du 10/09 04h00 au 13/09 12h00 (Paris) — 80 heures sans AUCUN canal IA ouvert, 36 passages d agents en echec, 7 travaux IA morts, et les deux audits quotidiens arretes (meme CLI). Voir T32. RIEN D AUTRE NE DEBLOQUE QUOI QUE CE SOIT. — D3 TRANCHEE LE 13/09 (non) : les agents du poste ne basculeront JAMAIS sur l API ; recharger ne rend donc plus rien aux recits, au courrier ni aux audits. La question ne porte plus que sur l assistance et l optimiseur, seuls usages API restants depuis le 05/09 — et sur ton mot : « je n aurai plus d erreur de ce genre ». Plus rien en amont n en depend.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T6","ref":"TRK-065","feu":0,"quoi":"Prevenir le titulaire de compte sans appareil","note":"21 notifications perdues. Cette personne se croit prevenue et ne l est pas. MESURE LE 10/09 : sur 30 jours, les deux destinataires en echec faute d appareil sont a EGALITE, 9 et 9 — l un est le compte technique d identifiant nul, qui ne pourra jamais porter d appareil, l autre est un VRAI super-administrateur. C est l arithmetique du 42 vers environ 21, et c est la moitie humaine qu il faut joindre. AU 13/09, MESURE FRAICHE : 53 notifications perdues en UNE semaine pour ce compte (ligne hebdomadaire du 11/09, compte technique desormais ecarte — T17 FAIT).","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T35","ref":"TRK-071","feu":0,"quoi":"Ouvrir un second abonnement reserve aux agents du poste — quand tu le decideras (D7)","note":"D7 TRANCHEE LE 13/09 (oui, mais pas maintenant) : « c est une bonne solution mais pas pour le moment, on reste sur la solution actuelle ; laisse-la moi dans les choses a faire pour ne pas oublier ». Le jour venu : un compte Pro (~20 $ par mois) connecte a la CLI des agents (recits, courrier — les audits restent sur ton abonnement, ils tournent dans ton application), et une semaine de mesure pour verifier que ses limites tiennent les ~200 recits quotidiens. Le declencheur raisonnable : un second plafond hebdomadaire malgre T34.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T8","ref":"TRK-001 · TRK-027","feu":0,"quoi":"Controler les antennes de trois vehicules","note":"FS-253-HR, FZ-862-VY, KSR•370. Antenne intermittente, pas panne resolue : les fix se reperdent apres chaque episode referme.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false}],"moi":[],"guette":[{"id":"T14","quoi":"Provoquer ou requalifier : boitier debranche ne fait pas taire les alarmes","quand":"test daté"},{"id":"T18","quoi":"Guetter « SMS non remis au relais » — motif technique CONSERVE","quand":"occasion"},{"id":"T21","quoi":"Accuse de remise de la passerelle SMS","quand":"bloqué"},{"id":"T10","quoi":"Le niveau de l'escalade doit suivre la CAUSE, pas la gravite","quand":"occasion"},{"id":"T13","quoi":"Recalage cartographique : flux neuf repare, mesure a redefinir, historique a rattraper","quand":"occasion"},{"id":"T19","quoi":"REQUALIFIER — l'occasion ne viendra pas seule","quand":"test daté"},{"id":"T20","quoi":"Confier a un humain : le badge ambre du mode fix","quand":"test daté"},{"id":"T27","quoi":"La carte survit a une perte de contexte WebGL","quand":"occasion"},{"id":"T28","quoi":"Redefinir la mesure du recalage : a la cloture, sur une fenetre fermee","quand":"occasion"},{"id":"T29","quoi":"Relire la garde du deploiement au moment ou elle va tuer, pas au moment ou l on decide","quand":"occasion"},{"id":"T30","quoi":"Dedupliquer l alerte d exces de vitesse sur l EXCES, pas sur l identifiant de trajet","quand":"occasion"},{"id":"T34","quoi":"Le poste sait qu il est au plafond : les agents s arretent seuls, un courriel part, un bouton relance tout — decision D5","quand":"occasion"},{"id":"T36","quoi":"Les agents du poste meurent d un Ctrl-C qui ne leur est pas destine — fenetre cachee, CLI isolee, limite corrigee","quand":"occasion"},{"id":"T15","quoi":"Guetter : « Un point de mesure systeme n'a pas pu etre enregistre »","quand":"occasion"}],"vps":[{"id":"V28","quoi":"Tuer le client Docker bloque depuis 04h34 UTC le 13/09 — 5e occurrence de VPS-016"},{"id":"V1","quoi":"Porter les 6 IMEI muets a l'exploitant"},{"id":"V2","quoi":"Sortir du parc les 6 boitiers muets depuis plus de 7 jours"},{"id":"V3","quoi":"Un seul ticket hebergeur pour les deux ecritures root"},{"id":"V4","quoi":"Planifier un redemarrage vers 23 h 30"},{"id":"V5","quoi":"Arbitrer le budget de collecte"},{"id":"V7","quoi":"Poser les limites memoire sur 30 conteneurs"},{"id":"V8","quoi":"Separer les projets compose deploy"},{"id":"V12","quoi":"Restreindre la cle CI github-actions-vizyo-auth"},{"id":"V13","quoi":"ExecStart par bash, et OnFailure sur tracky-backup"},{"id":"V14","quoi":"Fixer l'heure du rafraichissement apt (et non reduire son alea)"},{"id":"V15","quoi":"Epingler Traefik par digest"},{"id":"V23","quoi":"Afficher l'ecart en jours sur /admin → Audit VPS"},{"id":"V29","quoi":"Un seul rotateur pour les journaux de conteneur — retirer la stanza logrotate a copytruncate"},{"id":"V30","quoi":"Reconnaitre le coffre Vaultwarden, les comptes vaultbk / conductorbk et l adresse 179.198.198.199"},{"id":"V6","quoi":"Donner un second depositaire a la copie hors-site"},{"id":"V9","quoi":"Trancher les 4,5 Go d'outillage de developpement dans /root"},{"id":"V16","quoi":"Epingler alpine par empreinte"},{"id":"V17","quoi":"Purger 1,4 Go de copies sans retention"},{"id":"V18","quoi":"Multiplexage SSH cote POSTE"},{"id":"V20","quoi":"Etiqueter les images de repli au build"},{"id":"V21","quoi":"Trancher quel mecanisme gouverne le cache de build"},{"id":"V22","quoi":"Echantillonner wchan 3 fois et publier la repartition"},{"id":"V26","quoi":"Ranger les deux dossiers de sauvegarde abandonnes"},{"id":"V27","quoi":"Trancher si la base de DEMONSTRATION doit etre sauvegardee"},{"id":"V10","quoi":"Retirer /opt/vizyo-leads"},{"id":"V19","quoi":"random_page_cost sur 6 bases"}],"decisions":[{"id":"D1","sujet":"Le script qui refuse de déployer pendant un passage","texte":"Il lit la base et refuse de partir si l’automatisation tourne. Il marche : testé le 08/09, il a refusé, code de sortie 1. Mais l’audit du 10/09 montre qu’il ne suffit pas : il lit la base UNE FOIS, au tout début, puis construit l’image pendant plusieurs minutes avant de recréer les conteneurs — or c’est la recréation qui tue, pas la construction. Un déploiement lancé entre HH:40 et HH:45 franchit donc la garde à juste titre et tue quand même le passage. Le rendre obligatoire sans le corriger (T29) protégerait de tout sauf du cas le plus probable.","options":[{"v":"obligatoire","l":"Le rendre incontournable"},{"v":"aide","l":"Le laisser en simple aide"}],"tranchee":{"le":"13/09","choix":"obligatoire","note":"Ajouter un taches a faire, prendre le temps de bien le faire pour ne pas crée des bugs ! et bloquage.","suite":"Fait le jour même : T29 et T33 — la garde relue juste avant la recréation, et un déploiement hors script signalé au centre d’alerte 109 s plus tard."}},{"id":"D2","sujet":"Le rythme du rattrapage des tracés","texte":"Quinze par heure aujourd’hui. Le compteur en haut de page dit où en est le stock et combien de jours il reste — il descend tout seul, sans intervention. Réglable jusqu’à cinquante sans redéployer, ce qui diviserait l’attente par plus de trois. La seule retenue est la politesse envers OSRM, qui est un service public gratuit.","options":[{"v":"garder","l":"Garder 15 par heure"},{"v":"monter","l":"Monter à 50 — 3× plus vite"}],"tranchee":{"le":"13/09","choix":"garder","note":"Prendre le temps de bien le travailler, le mettre dans l'ordre :)","suite":"Rien à changer : quinze par heure, le compteur en haut de page descend seul."}},{"id":"D3","sujet":"Un compte API en secours — et pour quoi","texte":"Pendant 80 h (10 → 13/09), aucun canal IA : la CLI du poste au plafond, les comptes Anthropic et OpenAI à sec — Anthropic par ta décision du 05/09 (l’API ne sert que l’assistance et l’optimiseur). Coût mesuré : 0 récit sur trois jours, 7 travaux morts, les deux audits arrêtés deux jours, et le rapport d’activité hebdomadaire du 11/09 toujours pas rédigé le 13 à 15 h — le seul de ces effets qu’un client peut voir. Aujourd’hui les travaux du poste n’ont aucun chemin vers l’API : recharger seul ne suffit pas, il faut aussi que le serveur rédige lui-même quand la CLI est au plafond (une journée de code). Le courrier coûterait environ 3 $ par mois en Sonnet ; les récits, environ 3 $ par jour de plafond. Ce que je recommande : recharger 20 $ et coder le repli pour le courrier seulement — c’est lui qui porte les rapports, et il est léger.","options":[{"v":"courrier","l":"Recharger 20 $ — repli du courrier seulement"},{"v":"tout","l":"Recharger — repli du courrier et des récits"},{"v":"non","l":"Non : tout attend la remise à zéro"}],"tranchee":{"le":"13/09","choix":"non","note":"Non alors j'ai fait une erreur j'ai oublié de payé et je suis parti en vacance donc ca à bloqué mais je n'aurai plus d'erreur de ce genre, donc tout prio au agent locaux et ne pas switch sur un solution API !","suite":"Aucun repli API ne sera codé. T1 n’est plus bloquante : elle ne concerne plus que l’assistance et l’optimiseur."}},{"id":"D4","sujet":"Un récit pour quels trajets","texte":"Les récits sont le premier volume automatisé de l’abonnement : ~200 appels par jour en Sonnet, un par trajet analysé. Sur sept jours, 27 % des récits décrivent des trajets de moins de 3 km, 9 % de moins d’un kilomètre — des manœuvres de parking racontées en trois phrases. Ne pas les narrer ne retire rien à l’analyse, ni aux rapports, ni aux alertes : seul le texte manque. Ce que je recommande : au-delà d’un kilomètre — le gain est sûr et personne ne relira le récit d’un déplacement de 600 m.","options":[{"v":"tous","l":"Tous les trajets (comme aujourd’hui)"},{"v":"1km","l":"Au-delà d’un kilomètre (−9 %)"},{"v":"3km","l":"Au-delà de trois kilomètres (−27 %)"}],"tranchee":{"le":"13/09","choix":"tous","note":"Faire le récit tout de le monde, faire le rattrapage car j'ai eu un bug d'agent IA pour 3 jours donc bien faire le récit de tout les trajets !","suite":"Fait : 0 trajet sans récit sur toute la rétention le 13/09 à 17 h 28 UTC (555 récits écrits dans la journée) — T37 close. Et T36 a corrigé ce qui tuait les passages du rattrapage."}},{"id":"D5","sujet":"Le poste doit-il savoir qu’il est au plafond","texte":"Pendant le plafond, les agents ont essayé 36 fois pour rien — un passage toutes les deux heures, chacun avec son contrôle de session et sa ligne d’échec — alors que la CLI annonce l’heure de remise à zéro dans son message dès la première fois. Le geste : à la première réponse « plafond », l’unique porte vers la CLI (cli-claude.cjs) retient l’heure annoncée et refuse d’appeler jusque-là ; les agents sortent aussitôt en disant pourquoi, la sentinelle n’écrit qu’une ligne (c’est déjà le cas depuis T31), et tout repart seul à l’heure dite. Zéro perte, zéro risque : un marqueur périmé se lève au premier appel qui passe. Ce que je recommande : oui, je le code dans la foulée.","options":[{"v":"oui","l":"Oui — les agents s’arrêtent d’eux-mêmes jusqu’à l’heure annoncée"},{"v":"non","l":"Non — laisser essayer toutes les deux heures"}],"tranchee":{"le":"13/09","choix":"oui","note":"Si échoue par exemple 5 heures d'affilé alors stoppé mais par contre bien faire un mails et aussi une page pour tout redémarrer ! (dans admin de tracky et dans les truc automatiser !)","suite":"Fait : T34 déployée le 13/09 à 17 h 37 UTC et vérifiée sur une pause posée à la main — les agents sortent en une seconde, un courriel est parti à 17 h 50, le bouton « Reprendre maintenant » de /admin l’a levée. Reste à voir au prochain vrai plafond."}},{"id":"D6","sujet":"Le modèle des deux audits quotidiens","texte":"Les audits du centre d’alerte (03:09) et du VPS (04:21) durent ~35 min chacun et tournent en Opus, faute de modèle fixé : ce sont les plus gros consommateurs automatisés de l’abonnement, et ils sont aussi les premiers à s’arrêter au plafond. Sonnet pèse environ cinq fois moins sur la limite hebdomadaire. L’audit VPS est mécanique — collecte, comparaison, constats — et s’en accommoderait ; celui du centre d’alerte écrit les fiches, décide des tâches et alimente cette page, sa qualité compte. Ce que je recommande : Sonnet pour le VPS, Opus pour le centre d’alerte.","options":[{"v":"opus","l":"Opus pour les deux (aujourd’hui)"},{"v":"mixte","l":"Sonnet pour le VPS, Opus pour le centre d’alerte"},{"v":"sonnet","l":"Sonnet pour les deux"}],"tranchee":{"le":"13/09","choix":"opus","note":"On reste sur Opus, j'ai eu un bugs pour le budget mais ca ne ce reproduira plus ne t'en fait pas !","suite":"Inchangé : les deux audits restent en Opus."}},{"id":"D7","sujet":"Un abonnement à part pour les agents du poste","texte":"Le plafond a été atteint parce que tes sessions de développement et la production partagent la même limite hebdomadaire : une grosse semaine de travail affame les récits et le courrier. Un second compte, réservé aux agents de la CLI (récits, courrier — les audits restent sur le tien, ils tournent dans ton application), les isolerait : environ 20 $ par mois en Pro, si ses limites suffisent aux ~200 récits quotidiens — à mesurer une semaine avant de conclure. Ce que je recommande : pas maintenant. D4, D5 et D6 réduisent la pression ; si un second plafond survient malgré elles, on ouvre ce compte.","options":[{"v":"oui","l":"Oui, ouvrir un second compte pour les agents"},{"v":"plus-tard","l":"Pas maintenant — d’abord D4, D5, D6"}],"tranchee":{"le":"13/09","choix":"oui","note":"Tu as raison c'est une bonne solution mais pas pour le moment on va reste sur la solution actuel, par contre cette tache laisse la moi dans les choses a faire pour ne pas oublié !","suite":"Pas maintenant, par ton choix : T35 le garde dans ce qui t’attend, sans urgence, pour ne pas l’oublier."}},{"id":"D8","sujet":"Les quatre questions du coupe-circuit — tranchées par le chantier fiabilité ?","texte":"Rectification d’abord : la commande qui a échoué le 04/09 à 05 h 00 sur FG-669-DQ n’était pas une coupure mais une REMISE EN ROUTE — le véhicule avait été coupé la veille à 20 h 00 (acquittée), le relais SMS n’a pas répondu en dix secondes, le planificateur a réessayé une minute plus tard par SMS sans confirmation, et le véhicule n’a plus bougé jusqu’à ta vérification sur place le 12/09. C’est le cas (d), pas le cas (c). Sur 30 jours : près de 2 000 commandes moteur, une seule en échec franc, 154 « envoyées » jamais acquittées (dont 55 remises en route par SMS), et sur 731 soirs de coupure, 44 lendemains sans remise en route prouvée à 7 h. Depuis le 11/09 à 20 h 49 tu as coupé les 37 plannings, et le chantier fiabilité ouvert le 12/09 répond aux quatre questions : (a) les dix secondes restent, mais une remise en route est réessayée par des chemins indépendants jusqu’à confirmation ou escalade humaine ; (b) remise en route répétable et idempotente, coupure jamais rejouée après sa validité, idempotence garantie par le serveur ; (c) et (d) toute remise en route non confirmée est une alerte critique en moins de soixante secondes, et une coupure automatique est refusée si la voie de reprise est dégradée. Ce que je recommande : tenir T3 pour tranchée par ce chantier, et suivre la remise en service (T38) plutôt que rouvrir les questions.","options":[{"v":"chantier","l":"Oui — tranchées par le chantier fiabilité"},{"v":"revoir","l":"Non — je veux en rediscuter"}]},{"id":"D9","sujet":"Qui doit recevoir les excès de vitesse","texte":"Deux sociétés armées (cdef31, mh cars), déjà réglées à +40 km/h sur la limite et 130 km/h absolu. Sur quatorze jours :        prises », plus bas, où elle se lit sans pouvoir être recliquée par mégarde. */
    if (nA) {
      h += '<p class="intro" style="margin-top:6px">Et ' + nA + (nA > 1 ? ' questions à trancher' : ' question à trancher') + '. Réponds ici : je lis la page, et ma recommandation est dans chaque texte.</p>';
      h += '<div class="decisions">';
      aTrancher.forEach(function (d) {
        var r = etat.decisions[d.id] || {};
        h += '<article class="decision">';
        h += '<div class="decision__tete"><span class="decision__ref">' + d.id + '</span><h3 class="decision__sujet">' + ech(d.sujet) + '</h3></div>';
        h += '<p class="decision__texte">' + ech(d.texte) + '</p>';
        h += '<div class="options">';
        d.options.forEach(function (o) {
          h += '<button class="opt" data-act="decision" data-id="' + d.id + '" data-val="' + o.v + '" aria-pressed="false"><span class="puce"></span>' + ech(o.l) + '</button>';
        });
        h += '</div>';
        h += '<textarea data-act="note" data-id="' + d.id + '" aria-label="Votre réponse à ' + d.id + '" placeholder="Ou dis-moi autre chose">' + ech(r.note || '') + '</textarea>';
        h += '</article>';
      });
      h += '</div>';
    } else if (DECISIONS.length) {
      h += '<p class="intro" style="margin-top:6px">Aucune question en attente — tes décisions sont <a href="#decisions">plus bas</a>.</p>';
    }
    h += '</section>';

    /* ── Décisions prises ── */
    if (prises.length) {
      h += '<section class="section" id="decisions"><div class="section__tete"><h2>Décisions prises</h2><span class="compte">' + prises.length + ' sur ' + DECISIONS.length + '</span></div>';
      h += '<p class="intro">Ce que tu as tranché, avec tes mots, et ce que j’en fais. Pour revenir sur l’une d’elles, dis-le moi.</p>';
      h += '<div class="decisions">';
      prises.forEach(function (d) {
        var r = reponse(d), t = d.tranchee || {};
        h += '<article class="decision est-tranchee decision--prise">';
        h += '<div class="decision__tete"><span class="decision__ref">' + d.id + (t.le ? ' · ' + ech(t.le) : '') + '</span><h3 class="decision__sujet">' + ech(d.sujet) + '</h3><span class="chip chip--accent">' + ech(libelleChoix(d, r.choix)) + '</span></div>';
        if (r.note) h += '<p class="decision__note">«&nbsp;' + ech(r.note) + '&nbsp;»</p>';
        if (t.suite) h += '<p class="decision__suite">' + ech(t.suite) + '</p>';
        h += '</article>';
      });
      h += '</div></section>';
    }

    /* ── Ce que je code ── */
    h += '<section class="section" id="moi"><div class="section__tete"><h2>Ce que je peux coder</h2><span class="compte" id="compte-moi">' + reste(MOI) + ' sur ' + MOI.length + '</span></div>';
    h += '<p class="intro">Par ordre d’utilité. Dis-m’en un, je le prends.</p>';
    h += '<div class="liste">';
    MOI.forEach(function (t) { h += ligne(t, '<span class="chip chip--accent">à coder</span>'); });
    h += '</div></section>';

    /* ── On guette ── */
    h += '<section class="section" id="guette"><div class="section__tete"><h2>Ce qu’on guette</h2><span class="compte">rien à faire</span></div>';
    h += '<p class="intro">Des correctifs en ligne qui attendent leur occasion, et des tâches qu’un prérequis retient. Rien à faire : la mesure tombe toute seule, et la pastille dit laquelle des deux raisons s’applique.</p>';
    h += '<div class="liste">';
    GUETTE.forEach(function (g) {
      h += '<div class="ligne est-lecture">';
      h += '<span class="ligne__puce" aria-hidden="true">◷</span>';
      h += '<span class="ligne__ref">' + ech(g.id) + '</span>';
      h += '<span class="ligne__quoi">' + ech(g.quoi) + '</span>';
      h += '<span class="ligne__chip"><span class="chip chip--calme">' + ech(g.quand) + '</span></span>';
      h += '</div>';
    });
    h += '</div></section>';

    /* ── VPS ── */
    h += '<section class="section" id="vps"><div class="section__tete"><h2>Côté VPS</h2><span class="compte">' + VPS.length + (VPS.length > 1 ? ' constats' : ' constat') + '</span></div>';
    h += '<p class="intro">Presque tous des gestes d’infrastructure, du plus grave au moins grave.</p>';
    h += '<div class="liste">';
    VPS.forEach(function (v) {
      h += '<div class="ligne est-lecture">';
      h += '<span class="ligne__puce" aria-hidden="true">▪</span>';
      h += '<span class="ligne__ref">' + ech(v.id) + '</span>';
      h += '<span class="ligne__quoi">' + ech(v.quoi) + '</span>';
      h += '<span class="ligne__chip"><span class="chip chip--neutre">infra</span></span>';
      h += '</div>';
    });
    h += '</div></section>';

    /* ── Fait et prouvé ── */
    h += '<section class="section" id="faits"><div class="section__tete"><h2>Fait et prouvé</h2><span class="compte">' + FAITS.length + ' racontés · ' + FAITS_CLOS + ' tâches closes</span></div>';
    h += '<p class="intro">« Prouvé » veut dire mesuré sur la production, pas déployé. Un correctif déployé qu’aucun événement n’exerce reste un correctif non prouvé.</p>';
    h += '<div class="faits">';
    FAITS.forEach(function (f) {
      h += '<div class="fait"><span class="fait__date">' + ech(f.d) + '</span><span class="fait__quoi">' + ech(f.quoi) + '</span><p class="fait__preuve">' + f.preuve + '</p></div>';
    });
    h += '</div></section>';

    /* ── Où vit quoi ── */
    h += '<section class="section" id="rangement"><div class="section__tete"><h2>Où vit quoi</h2></div>';
    h += '<p class="intro">Cette page est le résumé. La trace complète est dans le dépôt.</p>';
    h += '<div class="rangement">';
    RANGEMENT.forEach(function (r) {
      h += '<div class="rangement__item"><span class="rangement__nom">' + ech(r.nom) + '</span><span class="rangement__texte">' + ech(r.texte) + '</span></div>';
    });
    h += '</div></section>';

    racine.innerHTML = h;
    majBarre();
  }

  /* ── Barre du bas ── */
  function majBarre() {
    var total = TOI.length + DECISIONS.length + MOI.length;
    var fini = TOI.filter(function (t) { return faite(t.id); }).length
             + MOI.filter(function (t) { return faite(t.id); }).length
             + (DECISIONS.length - decisionsRestantes());
    var pct = total ? Math.round(fini / total * 100) : 0;
    var barre = document.getElementById('barre');
    if (!barre) {
      barre = document.createElement('div');
      barre.className = 'barre'; barre.id = 'barre';
      document.body.appendChild(barre);
    }
    barre.innerHTML = '<div class="barre__contenu">'
      + '<div class="avancee"><div class="avancee__texte"><span>' + fini + ' sur ' + total + ' traités</span><span class="mono">' + pct + ' %</span></div>'
      + '<div class="piste"><div class="piste__valeur" style="width:' + pct + '%"></div></div></div>'
      + '<span class="sauvegarde" id="sauvegarde">état gardé sur cet appareil</span>'
      + '</div>';
  }

  function dire(texte, classe) {
    var el = document.getElementById('sauvegarde');
    if (!el) return;
    el.textContent = texte;
    el.className = 'sauvegarde' + (classe ? ' ' + classe : '');
  }

  /* ── Enregistrement ── */
  function enregistrer() {
    etat.maj = new Date().toISOString();
    try { localStorage.setItem('tracky-poste', JSON.stringify(etat)); } catch (e) {}
    if (!artefact) { dire('état gardé sur cet appareil'); return; }
    dire('enregistrement…');
    clearTimeout(minuteur);
    minuteur = setTimeout(publier, 700);
  }

  function publier() {
    if (!artefact || enCours) return;
    enCours = true;
    var doc = document.documentElement.cloneNode(true);
    var bloc = doc.querySelector('#etat');
    /* ⚠️ `outerHTML` ne rééchappe RIEN dans un <script> : une note contenant une balise
       fermante casserait la page publiée en deux. On échappe « < » — JSON.parse le rend tel
       quel à la relecture, et la balise ne peut plus apparaître. */
    if (bloc) bloc.textContent = JSON.stringify(etat).replace(/</g, '\\u003c');
    var barre = doc.querySelector('#barre');
    if (barre) barre.remove();
    var r = doc.querySelector('#racine');
    if (r) r.innerHTML = '';
    artefact.publish('<!doctype html>' + doc.outerHTML).then(function () {
      enCours = false;
      dire('enregistré pour tout le monde', 'est-ok');
    }).catch(function (err) {
      enCours = false;
      var code = err && err.code;
      if (code === 'conflict') { dire('une autre version a gagné', 'est-erreur'); return; }
      if (code === 'not_granted' || code === 'not_writer') { artefact = null; dire('état gardé sur cet appareil'); return; }
      dire('gardé ici seulement', 'est-erreur');
    });
  }

  /* ── Interactions ── */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.tagName === 'TEXTAREA') return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'tache') {
      etat.taches[id] = !etat.taches[id];
      rendre(); enregistrer();
    } else if (act === 'decision') {
      var d = decision(id), v = b.getAttribute('data-val');
      d.choix = d.choix === v ? '' : v;
      rendre(); enregistrer();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.tagName !== 'TEXTAREA' || t.getAttribute('data-act') !== 'note') return;
    decision(t.getAttribute('data-id')).note = t.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { enregistrer(); }, 900);
  });

  rendre();

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (a) {
      if (a) { artefact = a; dire('prêt — les coches sont partagées'); }
    }).catch(function () {});
  }
})();
</script>
