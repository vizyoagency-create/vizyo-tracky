<title>Poste de commande Tracky</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  /* ── Charte Tracky, jetons réels de l'application ── */
  --fond:      #F2F5F3;
  --surface:   #FFFFFF;
  --surface-2: #EAEFEB;
  --trait:     #DDE4E0;
  --trait-fort:#C3CEC8;
  --encre:     #0A1311;
  --encre-2:   #3D4A45;
  --encre-3:   #6B7873;
  --accent:      #0A9E6C;   /* accent lisible sur fond clair */
  --accent-vif:  #10E0A0;   /* le vert de marque */
  --accent-fond: #E4F6EE;
  --alerte:      #C0453F;
  --alerte-fond: #FBEAE9;
  --attente:     #96690B;
  --attente-fond:#FBF2DE;
  --calme:       #46617A;
  --calme-fond:  #E8EFF5;
  --ombre:   0 1px 2px rgb(10 19 17 / .05);
  --ombre-2: 0 1px 2px rgb(10 19 17 / .06), 0 8px 26px rgb(10 19 17 / .07);
  --titre: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --texte: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  --colonne: 1040px;
}
/* ⚠️ CETTE PAGE EST EN CLAIR, TOUJOURS — demande du propriétaire (10/09).
   Elle ne suit donc pas le thème de l'hôte : `color-scheme: light` le déclare, et le fond du
   corps est peint explicitement, sans quoi la page emprunterait le fond sombre de son hôte. */

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--fond); color: var(--encre-2);
  font-family: var(--texte); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; color: var(--encre); font-family: var(--titre); text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent-vif); outline-offset: 2px; border-radius: 5px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#racine { max-width: var(--colonne); margin: 0 auto; padding: 40px 26px 128px; display: flex; flex-direction: column; gap: 46px; }

/* ── En-tête ── */
.chapeau { display: flex; flex-direction: column; gap: 20px; }
.marque { display: flex; align-items: center; gap: 10px; }
.marque__logo {
  width: 26px; height: 27px; flex: none; background: var(--accent);
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
}
.marque__mot { font-family: var(--mono); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--encre-3); }
.titre { font-size: 36px; line-height: 1.05; font-weight: 700; letter-spacing: -.022em; }
.chapo { max-width: 62ch; font-size: 16px; color: var(--encre-2); }
.sommaire { display: flex; flex-wrap: wrap; gap: 7px; }
.sommaire a {
  display: inline-flex; align-items: center; gap: 7px; height: 31px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  color: var(--encre-2); font-size: 13px; text-decoration: none;
}
.sommaire a:hover { border-color: var(--trait-fort); color: var(--encre); }
.sommaire b { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--encre-3); }
.sommaire a.urgent b { color: var(--alerte); }

/* ── Bande de chiffres ──
   `auto-fit` plutôt qu'un nombre de colonnes fixe : la bande passe de quatre à deux puis à une
   toute seule, quelle que soit la largeur du volet. Un demi-écran ne coupe donc rien. */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 1px; background: var(--trait); border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
.chiffre { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 1px; }
.chiffre b { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--encre); letter-spacing: -.02em; line-height: 1.3; }
.chiffre span { font-size: 12.5px; color: var(--encre-3); }
.chiffre.est-alerte b { color: var(--alerte); }

/* ── Sections ── */
.section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 18px; }
.section__tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--trait); padding-bottom: 9px; }
.section__tete h2 { font-size: 21px; font-weight: 600; letter-spacing: -.012em; }
.compte { font-family: var(--mono); font-size: 11.5px; color: var(--encre-3); margin-left: auto; }
.intro { color: var(--encre-3); max-width: 74ch; font-size: 14px; }
.intro code, .ligne__note code, .fait__preuve code { font-family: var(--mono); font-size: .87em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--encre-2); }

/* ── Ce qui tourne tout seul ── */
.machines { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.machine { background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; padding: 15px 17px; display: flex; flex-direction: column; gap: 9px; }
.machine__nom { font-size: 14.5px; font-weight: 600; color: var(--encre); }
.machine__texte { font-size: 13.5px; color: var(--encre-3); }
.piste { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.piste__valeur { height: 100%; background: var(--accent); border-radius: 999px; }
.machine__pied { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--encre-3); }

.ligne__puce { color: var(--encre-3); font-size: 13px; align-self: start; margin-top: 2px; }
.ligne.est-lecture .ligne__quoi { font-weight: 400; }
/* ── Listes de tâches ── */
.liste { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--surface); }
.ligne { display: grid; grid-template-columns: 24px 62px minmax(0, 1fr) auto; gap: 5px 14px; align-items: baseline; padding: 13px 17px; border-top: 1px solid var(--trait); }
.ligne:first-child { border-top: 0; }
.ligne.est-faite { background: var(--surface-2); }
.ligne.est-faite .ligne__quoi { text-decoration: line-through; color: var(--encre-3); }
.ligne.est-faite .ligne__note { display: none; }
.case {
  width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--trait-fort);
  background: var(--surface); display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; color: transparent; align-self: start; margin-top: 1px;
  transition: background .12s, border-color .12s;
}
.case:hover { border-color: var(--encre-3); }
.case.est-cochee { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.ligne__ref { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--encre-3); align-self: start; margin-top: 3px; }
.ligne__quoi { font-size: 14.5px; color: var(--encre); font-weight: 500; }
.ligne__quoi .feu { color: var(--alerte); font-weight: 700; letter-spacing: -.04em; margin-right: 4px; }
.ligne__note { grid-column: 3 / -1; font-size: 13px; color: var(--encre-3); }
.ligne__chip { align-self: start; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; font-family: var(--mono); }
.chip--alerte { background: var(--alerte-fond); color: var(--alerte); }
.chip--attente { background: var(--attente-fond); color: var(--attente); }
.chip--accent { background: var(--accent-fond); color: var(--accent); }
.chip--calme { background: var(--calme-fond); color: var(--calme); }
.chip--neutre { background: var(--surface-2); color: var(--encre-3); }

/* ── Décisions ── */
.decisions { display: flex; flex-direction: column; gap: 11px; }
.decision { background: var(--surface); border: 1px solid var(--trait); border-left: 3px solid var(--attente); border-radius: 10px; padding: 15px 17px; display: flex; flex-direction: column; gap: 11px; }
.decision.est-tranchee { border-left-color: var(--accent); }
.decision__tete { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap; }
.decision__ref { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--attente); }
.decision.est-tranchee .decision__ref { color: var(--accent); }
.decision__sujet { font-size: 16px; font-weight: 600; flex: 1; min-width: 220px; }
.decision__texte { font-size: 13.5px; color: var(--encre-3); max-width: 76ch; }
/* Une décision PRISE n'a plus de boutons : le choix devient une pastille dans l'en-tête, les
   mots du propriétaire une citation, et la suite donnée une ligne fléchée. La pastille peut
   porter une phrase entière — elle replie donc, contrairement aux autres pastilles. */
.decision--prise { gap: 8px; }
.decision--prise .chip { white-space: normal; height: auto; min-height: 22px; padding: 2px 9px; line-height: 1.35; }
.decision__note { font-size: 13.5px; color: var(--encre-2); font-style: italic; max-width: 76ch; }
.decision__suite { font-size: 13px; color: var(--encre-3); max-width: 76ch; }
.decision__suite::before { content: '→ '; color: var(--accent); font-weight: 600; }
.options { display: flex; gap: 7px; flex-wrap: wrap; }
.opt {
  display: inline-flex; align-items: center; gap: 8px; height: 33px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  color: var(--encre-2); font: inherit; font-size: 13.5px; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.opt:hover { border-color: var(--trait-fort); background: var(--surface-2); }
.opt .puce { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--trait-fort); flex: none; }
.opt.est-choisie { font-weight: 600; background: var(--accent-fond); border-color: var(--accent); color: var(--accent); }
.opt.est-choisie .puce { background: var(--accent); border-color: var(--accent); }
textarea {
  width: 100%; min-height: 52px; resize: vertical; padding: 9px 11px;
  border: 1px solid var(--trait); border-radius: 8px; background: var(--fond);
  color: var(--encre); font: inherit; font-size: 13.5px;
}
textarea::placeholder { color: var(--encre-3); }

/* ── Fait et prouvé ── */
.faits { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--surface); }
.fait { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 14px; padding: 13px 17px; border-top: 1px solid var(--trait); }
.fait:first-child { border-top: 0; }
.fait__date { font-family: var(--mono); font-size: 11.5px; color: var(--accent); font-weight: 500; margin-top: 2px; }
.fait__quoi { font-size: 14.5px; color: var(--encre); font-weight: 500; }
.fait__preuve { grid-column: 2; font-size: 13px; color: var(--encre-3); }

/* ── Où vit quoi ── */
.rangement { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.rangement__item { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 3px; }
.rangement__nom { font-family: var(--mono); font-size: 12.5px; color: var(--encre); font-weight: 500; word-break: break-word; }
.rangement__texte { font-size: 13px; color: var(--encre-3); }

/* ── Barre du bas ── */
.barre { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--trait); box-shadow: var(--ombre-2); z-index: 10; }
.barre__contenu { max-width: var(--colonne); margin: 0 auto; padding: 10px 26px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.avancee { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
.avancee__texte { font-size: 12.5px; color: var(--encre-3); display: flex; justify-content: space-between; gap: 10px; }
.sauvegarde { font-family: var(--mono); font-size: 12px; color: var(--encre-3); white-space: nowrap; }
.sauvegarde.est-ok { color: var(--accent); }
.sauvegarde.est-erreur { color: var(--alerte); }

/* ── Largeurs contraintes ──
   Le volet est souvent à demi-écran : ces paliers valent pour la LARGEUR DE LA PAGE, pas celle
   de l'appareil, donc ils tombent aussi sur un grand écran dont la fenêtre est réduite. */
@media (max-width: 900px) {
  #racine { padding: 32px 20px 132px; gap: 40px; }
  .titre { font-size: 32px; }
  /* La pastille de droite passe sous le texte plutôt que de le comprimer. */
  .ligne { grid-template-columns: 24px 58px minmax(0, 1fr); }
  .ligne__chip { grid-column: 3; margin-top: 2px; }
  .ligne__note { grid-column: 3; }
}
@media (max-width: 680px) {
  #racine { padding: 24px 14px 148px; gap: 34px; }
  .titre { font-size: 27px; }
  .chapo { font-size: 15px; }
  /* Deux colonnes : la case, puis tout le reste empilé. La référence et la pastille partagent
     la première ligne — chacune sur la sienne gaspillait deux hauteurs de texte par tâche. */
  .ligne { grid-template-columns: 24px minmax(0, 1fr); padding: 12px 14px; gap: 3px 12px; }
  .case, .ligne__puce { grid-row: 1; }
  .ligne__ref { grid-column: 2; grid-row: 1; margin-top: 0; }
  .ligne__chip { grid-column: 2; grid-row: 1; justify-self: end; margin-top: 0; }
  .ligne__quoi { grid-column: 2; grid-row: 2; }
  .ligne__note { grid-column: 2; grid-row: 3; }
  .fait { grid-template-columns: 1fr; padding: 12px 14px; }
  .fait__preuve { grid-column: 1; }
  .decision { padding: 14px 15px; }
  .decision__sujet { min-width: 0; font-size: 15.5px; }
  .machine, .rangement__item { padding: 13px 14px; }
  .section__tete h2 { font-size: 19px; }
  .compte { margin-left: 0; }
  .barre__contenu { padding: 9px 14px; gap: 10px; }
}
@media (max-width: 420px) {
  .opt { width: 100%; justify-content: center; }
  .sommaire a { font-size: 12.5px; padding: 0 11px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>

 solution actuelle ; laisse-la moi dans les choses a faire pour ne pas oublier ». Le jour venu : un compte Pro (~20 $ par mois) connecte a la CLI des agents (recits, courrier — les audits restent sur ton abonnement, ils tournent dans ton application), et une semaine de mesure pour verifier que ses limites tiennent les ~200 recits quotidiens. Le declencheur raisonnable : un second plafond hebdomadaire malgre T34.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T39","ref":"TRK-065","feu":0,"quoi":"Rouvrir les notifications aux clients (PUSH_ROLLOUT=ALL) quand les tests seront finis","note":"Depuis le 13/09 au soir, seuls les super-admins recoivent des notifications push (PUSH_ROLLOUT=SUPER_ADMIN_ONLY dans /opt/vizyo-tracky/deploy/vps/.env.prod, ligne 102) — ta consigne : « je ne veux pas que les utilisateurs a part moi soient prevenus, je l activerai quand j aurai tout teste ». Avant : ALL, et trois comptes clients avaient recu 88 alertes push en 30 jours (mh cars 63 exces de vitesse). Pour rouvrir : remettre PUSH_ROLLOUT=ALL dans ce fichier puis bash /opt/vizyo-tracky/deploy/vps/deploy.sh — rien d autre a toucher, la garde est asymetrique (seule la chaine exacte ALL ouvre). A cocher le jour ou tu le fais.","pastille":{"l":"toi","c":"chip--alerte"},"phare":false},{"id":"T61","ref":"TRK-066 · S21 · doc 10 test B/C","feu":0,"quoi":"Deux SIM de boîtiers (HD-584-BF, BP-434-RD) restent INJOIGNABLES par SMS depuis le S21 après remise en état ; les huit autres sont revenues — test depuis un autre opérateur ou ticket WhereverSIM","note":"Mesuré le 14/09 (téléphone + base du relais depuis juin, lecture seule) : vers 10 numéros +34 590 1030 … (605300, 609501, 621085, 621087, 621088, 621098, 621099, 621100, 621103, 621105 — véhicules HD-597-XY, GS-014-NY, HM-779-GA, FZ-862-VY, FS-808-CE, FS-253-HR, HD-584-BF, GR-294-VW, BP-434-RD, HM-769-GA) chaque SMS du S21 échoue AU DÉPART (le réseau Free refuse la soumission : « RESULT_ERROR_GENERIC_FAILURE »), à toute heure  à 09:34:54, à 8 s et 30 s d'envois réussis vers leurs voisines. Vérifié dans Tracky : ces deux boîtiers sont ONLINE (positions 09:36), l'IMEI vu par le fournisseur = l'IMEI du boîtier (la SIM est bien dedans, pour les 11 testées), statut Activée, session data en cours. CONCLUSION RÉVISÉE : le refus au départ n'était pas « la destination » pour 8 SIM sur 10 — elles passent depuis que le téléphone a été remis en état (le redémarrage du 11/09 au soir, puis la reconfiguration du jour) ; il PERSISTE pour 2 SIM, sans différence visible côté fournisseur ni côté Tracky. Pour ces deux véhicules le secours SMS n'existe pas aujourd'hui : TCP seul. Gestes restants (toi, 1 SMS chacun, coût annoncé avant) : (1) un check123456 vers …621099 depuis une SIM d'un autre opérateur ; (2) sinon ticket WhereverSIM avec les 2 ICCID (SMS-MT provisionné ?). Aucun envoi de plus de ma part. 🔀 14/09 : T62 fusionné — pour ces deux véhicules, la coupe automatique n'est émise que boîtier connecté en TCP, la RESTORE repart en TCP toutes les 5 min et à chaque reconnexion, un SMS-sonde par 6 h au plus, une ligne DÉGRADATION par jour au centre d'alerte (doc 35). Le test « autre opérateur » et le remplacement de SIM restent à toi. 📏 14/09 10:45 : sms_logs de Tracky ne porte AUCUN sortant vers ces deux SIM depuis 30 j (les tests du matin sont partis du téléphone, pas du relais) → après déploiement, T62 les tiendra pour joignables jusqu'à trois échecs enregistrés PAR TRACKY ; la première coupe automatique tentera donc le SMS (refusé au départ, non facturé), la RESTORE aussi — puis « TCP seul ». À savoir avant ce soir. 📏 15/09 : HD-584-BF et BP-434-RD ont ete COUPES par TCP le 14/09 a 20h00 (ack +2 s et +5 s) — en ligne. Leur RESTORE du matin ne peut passer que par TCP : si le boitier est deconnecte a 05h00 UTC, aucun secours. 📏 16/09 : HD-584-BF et BP-434-RD coupés à 04:31 et remis en route à 07:00 par TCP (ACK 3 s et 5 s) — vivants, jamais de SMS sollicité. 📏 17/09 : PREMIER SMS DE TRACKY VERS CES DEUX  alerte n a aucune ligne, et la sentinelle deploiement ne sait comparer qu un conteneur CREE. Ce qui reste : un arbre git sur une branche de fonctionnalite, une image :latest qui n est pas celle qui tourne, et sur origin/main un commit de fusion (02b8a6cf) qui dit « correctif deploye sur prod » alors que leadDays est absent du conteneur. Geste (deploy/vps/deploy.sh + deploiement-sentinelle.service.ts) : (1) toute sortie en refus ou en abandon d attente ecrit une ligne {\"at\",\"sha\",\"branche\",\"refus\":\"passage en cours\"|\"fenetre HH:42-46\"|\"attente epuisee\",\"par\"} dans le meme journal.jsonl ; (2) la sentinelle deploiement, au demarrage ET a chaque lecture, ecrit une DEGRADATION « Deploiement de \u003csha> refuse a HH:MM (\u003cmotif>) — la production reste sur \u003csha courant> » avec refroidissement sur (sha, motif) ; (3) l ecran /admin/background-tasks montre le dernier refus a cote du dernier deploiement. NE PAS faire passer outre : le refus est juste, c est son silence qui ne l est pas. 📏 18/09 : le journal.jsonl porte desormais le champ sante (healthy) sur les trois deploiements du 17/09 apres 07h10, et le repli de 05h52 est journalise (attente false, repli pose) ; l ATTENTE de la garde se lit dans dureeS (3355, 6012). Le REFUS, lui, ne s ecrit toujours nulle part — la tache reste ouverte telle quelle.","pastille":{"l":"à coder","c":"chip--accent"},"phare":false},{"id":"T71","ref":"TRK-083","feu":1,"quoi":"Armer le guetteur d ACK TCP AVANT l écriture socket (ou mémoire de 30 s dans AckWaiter) — un boîtier qui répond plus vite que la base est déclaré « non confirmé »","note":"TROUVE LE 17/09 sur la coupe CDEF31 de GR-898-HY (16/09 20h01m30) : la trame part sur la socket EN PREMIER (engine-control.service.ts:1808), puis beginAttempt et writeSent en base, et SEULEMENT ENSUITE waitForAck (ligne 1985) — AckWaiterService n a aucune memoire des trames arrivees avant l inscription. Cette minute-la la base a mis 8,5 s (2,4 + 6,1 s contre 5 a 90 ms pour les 27 autres coupes ; dockerd a 92 pour cent derriere le client bloque de V33) et le boitier a repondu jt a 20h01m38,3, 0,9 s avant le guetteur → TIMED_OUT → SENT_UNCONFIRMED pour un vehicule bien coupe (69 positions, vitesse 0, contact coupe). Sur une RESTORE la meme course planifie le secours SMS (catch lignes 2038-2050) : SMS payant, seconde commande K, CRITICAL engine-control-restore a +15 min (T51) et push (T69) pour une remise en route reussie. Jumeaux : tracker-commands.service.ts:328-360 et tracker-fix-mode.service.ts:287 — cause plausible d une part du 0 ackedAt sur 4 823 de TRK-014. GESTE : (1) armer waitForAck() avant sessionRegistry.send() et l annuler (removeWaiter) si send rend false ; ou (2) memoire courte par IMEI (30 s) dans AckWaiterService relue a l inscription — couvre les trois services ; (3) journaliser la latence beginAttempt vers writeSent > 1 s. Ne pas allonger le delai de 15 s, ne pas retirer SENT_UNCONFIRMED, ne pas supprimer le repli SMS sur RESTORE.","pastille":{"l":"à coder","c":"chip--accent"},"phare":true},{"id":"T73","ref":"TRK-085 · TRK-088 · T51","feu":1,"quoi":"L identite du vehicule dans le message des temoins par vehicule, et un compteur d anti-flood qui ne se perd jamais — 7 RESTORE non prouvees, 14 notifications, 1 ligne","note":"TROUVE LE 18/09 : le 17/09 a 05h58, alertOverdueRestores() (engine-control.service.ts:2541-2629) a trouve 7 RESTORE non prouvees > 60 s, pose alertedAt sur 7, appele errorLogger.record() 7 fois et pousse 7 notifications restore-non-prouvee (14 SENT) — error_logs : 1 ligne (BP-434-RD). Meme matin, 6 SMS refuses vers les deux SIM de T61 → 4 lignes sms-gateway-status (une seule porte repeatedSuppressed = 1). Cause : ErrorLogger.record() (observability/error-logger.service.ts:122-133) deduplique sur source|level|message[0:140] pendant 60 s, et « RESTORE non confirme depuis plus de 60 s » comme « SMS en echec terminal (failed) » portent la plaque et l IMEI dans le contexte, pas dans le message ; le compteur des occurrences supprimees n est reporte qu a la PROCHAINE ecriture de la meme empreinte — jamais venue, donc 6 perdues sans trace. Le telephone en savait plus que l ecran. GESTE : (1) la plaque (ou l IMEI) dans le message des temoins par vehicule — engine-control-restore et sms-gateway-status au moins (engine-control-tcp-only, gps-integrity, schedule-cron, engine-control-interlock la portent deja) ; (2) a la premiere suppression d une empreinte, mettre a jour context.repeatedSuppressed de la ligne DEJA ecrite (un UPDATE par empreinte et par fenetre), ou ecrire le compte a la purge de la memoire ; (3) laisser la fenetre de 60 s. NE PAS supprimer l anti-flood ; NE PAS remplacer la ligne par la notification.","pastille":{"l":"à coder","c":"chip--accent"},"phare":false},{"id":"T68","ref":"TRK-081 · T49","feu":0,"quoi":"L interlock rouge toute une nuit ne doit ecrire qu UN CRITICAL, des rappels DEGRADATION horaires et une ligne de cloture — pas un CRITICAL par quart d heure et un e-mail par heure","note":"TROUVE LE 16/09, premiere nuit du chantier en production : l interlock a refuse les 25 coupes de 20h00 UTC pour « derniere preuve de remise SMS trop ancienne (> 24 h) » (juste : derniere remise prouvee 14/09 07h00, preuve manuelle du soir non envoyee, premiere preuve automatique a 02h30). signalWithheldCut (engine-control.service.ts:1691, T49 93dba465) espace les lignes de 15 min par raison (interlock|\u003creason>) et ecrit CHAQUE ligne en CRITICAL ; le cron des plannings retente sur les paliers 2 / 5 / 15 / 30 min sans ecrire (voulu), donc apres quatre refus les 24 vehicules reviennent ensemble toutes les 30 min et AL-927-QM a mi-chemin → 20 CRITICAL entre 20h00 et 01h09 (une par quart d heure, alternance 24 refus / 1 refus), ~36 attendues d ici 05h00, et le veilleur du taux d erreurs a envoye 5 e-mails « erreurs critiques — engine-control-interlock » (20h10, 21h20, 22h30, 23h30, 00h30). T49 a regle un interlock qui vacille, pas un interlock rouge par construction pendant neuf heures. GESTE (signalWithheldCut seul) : (1) premiere ligne d une cause = CRITICAL, inchange ; (2) rappels de la meme raison en DEGRADATION toutes les 60 min (ENGINE_INTERLOCK_REMINDER_SPACING_MS) avec compte cumule des refus et nombre de vehicules distincts ; (3) ligne de cloture DEGRADATION quand safe redevient vrai apres au moins une ligne (« Coupes automatiques a nouveau autorisees a HH:MM — N refus retenus pendant H h sur M vehicules ») ; (4) un changement de raison rouvre en CRITICAL. NE PAS toucher a la garde (fenetre 24 h, preuve) ni a l e-mail du veilleur ; ne pas archiver les 20 lignes. 17/09 : 25 lignes au total sur la nuit du 15 au 16 (20h00m00 a 02h24m20, une par quart d heure), 7 e-mails du veilleur (20h10 a 02h50). Nuit du 16 au 17 : 0 ligne — l interlock est reste vert, le correctif n a pas d occasion de s exercer.","pastille":{"l":"à coder","c":"chip--accent"},"phare":false},{"id":"T70","ref":"TRK-082","feu":0,"quoi":"La sentinelle « excès sans alerte » doit lire la même clé que T30 (l excès, pas le trajet) — 3 trajets recréés accusés à tort","note":"TROUVE LE 17/09 : le 16/09 a 06h30, premiere parole de la sentinelle « exces sans alerte » pour une societe armee (mh cars) — 3 trajets de FV-941-LZ du 15/09, tous recrees par le recalcul horaire a :45:00 APRES que l exces a produit son alerte sur le trajet jumeau (05h49 / startAt 05h22m37, 06h47 / 06h32m37, 15h51 / 15h25m57). createSpeedingAlert a retrouve le doublon par memeExces et n a pas re-alerte — c est T30 qui marche ; mais sentinelles-coherence.service.ts:499-506 juge « alerte » par alert.tripId = analyse.tripId. T30 a change la cle d identite de l alerte, l instrument lit encore l ancienne. GESTE (la sentinelle seule) : considerer un trajet comme alerte s il existe une alerte OVERSPEED du meme vehicule dont payload.startAt / endAt recouvre l instant de la decision (memeExces, le paquet partage — la meme fonction que le producteur), ou a defaut dont la fenetre de trajet chevauche. Ne pas retirer la sentinelle : le cas qu elle attrape (TRK-064) reste possible.","pastille":{"l":"à coder","c":"chip--accent"},"phare":false},{"id":"T74","ref":"TRK-086 · TRK-047 · T13","feu":0,"quoi":"Le recalcul horaire ne doit pas choisir un trajet brut qu il ne peut pas figer — HM-769-GA sans fix depuis 33 h fait crier TRIP_AUTOMATION toutes les heures","note":"TROUVE LE 18/09 : 8 ERROR TRIP_AUTOMATION « Recalcul impossible sur HM-769-GA : aucune position entre … alors que des trajets bruts y subsistent » entre le 17/09 18h29 et le 18/09 00h45, une par passage, tranche = la fenetre entiere. HM-769-GA est vivant (878 no_fix + 437 heartbeat en 24 h) sans position depuis le 16/09 15h28 et porte 35 trajets bruts (ignition / timeout, 31/08 et 11/09). Dans trip-automation.service.ts le trajet dirty est cherche depuis plancherRattrapage (60 j, ligne 873) mais la tranche est bornee par max(windowFrom, startedAt − 30 min) (ligne 883) → fromMs = windowFrom ; fenetre vide → alerte (au-dessus de l horizon, > 60 s, pas de voisin) ; le gel fige-sans-positions (lignes 980-988) cible startedAt dans [fromMs, toMs] : le trajet du 31/08 n y est pas, rien n est fige, rebelote au passage suivant. Le commentaire promet que l alerte ne se repete pas : vrai quand le trajet est dans la tranche, faux quand il est avant. Candidats : HM-733-GA (65 trajets bruts), HM-779-GA (39). GESTE, chemin horaire seul : (1) dirty depuis windowFrom − RECOMPUTE_BACKOFF_MS (les plus anciens sont au rattrapage, ligne 1072) ; ou (2) si dirty.startedAt \u003c fromMs, ne pas alerter ; et (3) quand lastPositionAt \u003c windowFrom, se taire : le fait est deja dit par gps-integrity. NE PAS retirer l alerte de TRK-047 ; NE PAS figer les 35 trajets a la main.","pastille":{"l":"à coder","c":"chip--accent"},"phare":false},{"id":"T57","ref":"TRK-066 · doc 19 §14","feu":0,"quoi":"Dépendances : lot séparé après stabilisation (maplibre critique, socket.io/ws, axios via twilio, multer)","note":"pnpm audit --prod (Tracky) : 1 critique (maplibre-gl, XSS sanitizer bypass, web), 28 hautes (axios via twilio legacy, lodash via @nestjs/config, multer/ws/engine.io/socket.io-parser via la plateforme, tmp via exceljs, brace-expansion, js-yaml via date-holidays, ip-address via geoip-lite, deepmerge-ts via prisma), 26 modérées ; Texto : 5 hautes (multer, deepmerge-ts). Aucune introduite par les branches ; les DoS Socket.IO/ws sont les plus pertinentes pour la disponibilité de l'API (donc du worker RESTORE). Ne PAS mêler à la livraison du coupe-circuit : lot dédié, une famille à la fois, suite complète entre chaque.","pastille":{"l":"à coder","c":"chip--accent"},"phare":false}],"guette":[{"id":"T41","quoi":"P0 — Donner une validité aux SMS CUT (ttl), une priorité aux RESTORE, un appareil explicite, et annuler le SMS CUT supplanté — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T10","quoi":"Le niveau de l'escalade doit suivre la CAUSE, pas la gravite","quand":"occasion"},{"id":"T13","quoi":"Recalage cartographique : flux neuf repare, mesure a redefinir, historique a rattraper","quand":"occasion"},{"id":"T30","quoi":"Dedupliquer l alerte d exces de vitesse sur l EXCES, pas sur l identifiant de trajet","quand":"occasion"},{"id":"T36","quoi":"Les agents du poste meurent d un Ctrl-C qui ne leur est pas destine — fenetre cachee, CLI isolee, limite corrigee","quand":"occasion"},{"id":"T44","quoi":"Sentinelle Android : hystérésis, bornes d'environnement, fraîcheur par appareil, délai d'envoi séparé du délai de santé — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T48","quoi":"Course ACK/SMS : ne jamais rétrograder ACKNOWLEDGED en SENT ; dispatcher une CUT PENDING orpheline au lieu de la rendre telle quelle — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T49","quoi":"Kill-switch et interlock : une ligne par cause et espacée, pas un CRITICAL par appel — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T50","quoi":"Glissement de confirmation réellement volontaire : ni un clic en bout de piste, ni la touche End — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T51","quoi":"Rappeler une RESTORE qui traîne (toutes les 15 min) et ne pas suspendre le clic manuel derrière la file SMS — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T52","quoi":"Santé par appareil (deviceId, simCards) et allowlist non bloquante pour une RESTORE — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T53","quoi":"Tests : exercer la table des tentatives, index dans schema.prisma, migration rejouée sur PostgreSQL réel, changement d'heure du 25/10 — DÉPLOYÉ le 15/09","quand":"occasion"},{"id":"T58","quoi":"La cle de refroidissement de la sentinelle des agents doit porter la CAUSE — et courrier-ia doit lire le premier objet JSON equilibre — sur main, FUSIONNÉ et poussé le 14/09, à déployer","quand":"occasion"},{"id":"T59","quoi":"Ne plus remonter au centre d alerte les appels avortes par la fermeture de la page sur le canal anonyme (robots) — sur main, FUSIONNÉ et poussé le 14/09, à déployer","quand":"occasion"},{"id":"T60","quoi":"Test fenetre-utile.spec.ts (trajets, sur main) tient à la milliseconde : deux Date.now() distincts — à figer — sur main, FUSIONNÉ et poussé le 14/09, à déployer","quand":"occasion"}],"vps":[{"id":"V33","quoi":"Tuer le client docker logs vizyo-auth-api bloqué depuis le 16/09 12:41 UTC (PID 3366708, parent bash -c 3366707) — 6e occurrence de VPS-016, dockerd à 92 %, 36 h 37 au 18/09"},{"id":"V3","quoi":"Un seul ticket hebergeur pour les deux ecritures root"},{"id":"V4","quoi":"Planifier un redemarrage vers 23 h 30"},{"id":"V5","quoi":"Arbitrer le budget de collecte"},{"id":"V6","quoi":"Donner un second depositaire a la copie hors-site — et, en attendant, reveiller le poste (WakeToRun)"},{"id":"V7","quoi":"Poser les limites memoire sur 30 conteneurs"},{"id":"V8","quoi":"Separer les projets compose deploy"},{"id":"V12","quoi":"Restreindre la cle CI github-actions-vizyo-auth"},{"id":"V13","quoi":"ExecStart par bash, et OnFailure sur tracky-backup"},{"id":"V14","quoi":"Fixer l'heure du rafraichissement apt (et non reduire son alea)"},{"id":"V15","quoi":"Epingler Traefik par digest"},{"id":"V17","quoi":"Ménage du VPS — cinq gestes préparés, une seule session : renommer les deux dossiers de sauvegarde abandonnés (éteint deux 🟠 faux par jour), purger 1,4 Go de copies sans rétention, retirer /opt/vizyo-leads, trancher les 4,5 Go d'outillage dans /root, épingler alpine par empreinte"},{"id":"V23","quoi":"Afficher l'ecart en jours sur /admin → Audit VPS"},{"id":"V29","quoi":"Un seul rotateur pour les journaux de conteneur — retirer la stanza logrotate a copytruncate"},{"id":"V30","quoi":"Reconnaitre le coffre Vaultwarden, les comptes vaultbk / conductorbk / dispocarbk, l adresse 179.198.198.199 et le role de depositaire de DEUX applications"},{"id":"V31","quoi":"Reparer le copieur hors-site de Vizyo Verify : ne plus s arreter sur un manifeste orphelin (cote poste), purger par paire (cote VPS)"},{"id":"V32","quoi":"Rendre le repere de repli reel : (a) until=72h sur le menage des images (10 s), (b) deploy.sh etiquette l image du CONTENEUR, pas :latest (a coder)"}],"decisions":[{"id":"D1","sujet":"Le script qui refuse de déployer pendant un passage","texte":"Il lit la base et refuse de partir si l’automatisation tourne. Il marche : testé le 08/09, il a refusé, code de sortie 1. Mais l’audit du 10/09 montre qu’il ne suffit pas : il lit la base UNE FOIS, au tout début, puis construit l’image pendant plusieurs minutes avant de recréer les conteneurs — or c’est la recréation qui tue, pas la construction. Un déploiement lancé entre HH:40 et HH:45 franchit donc la garde à juste titre et tue quand même le passage. Le rendre obligatoire sans le corriger (T29) protégerait de tout sauf du cas le plus probable.","options":[{"v":"obligatoire","l":"Le rendre incontournable"},{"v":"aide","l":"Le laisser en simple aide"}],"tranchee":{"le":"13/09","choix":"obligatoire","note":"Ajouter un taches a faire, prendre le temps de bien le faire pour ne pas crée des bugs ! et bloquage.","suite":"Fait le jour même : T29 et T33 — la garde relue juste avant la recréation, et un déploiement hors script signalé au centre d’alerte 109 s plus tard."}},{"id":"D2","sujet":"Le rythme du rattrapage des tracés","texte":"Quinze par heure aujourd’hui. Le compteur en haut de page dit où en est le stock et combien de jours il reste — il descend tout seul, sans intervention. Réglable jusqu’à cinquante sans redéployer, ce qui diviserait l’attente par plus de trois. La seule retenue est la politesse envers OSRM, qui est un service public gratuit.","options":[{"v":"garder","l":"Garder 15 par heure"},{"v":"monter","l":"Monter à 50 — 3× plus vite"}],"tranchee":{"le":"13/09","choix":"garder","note":"Prendre le temps de bien le travailler, le mettre dans l'ordre :)","suite":"Rien à changer : quinze par heure, le compteur en haut de page descend seul."}},{"id":"D3","sujet":"Un compte API en secours — et pour quoi","texte":"Pendant 80 h (10 → 13/09), aucun canal IA : la CLI du poste au plafond, les comptes Anthropic et OpenAI à sec — Anthropic par ta décision du 05/09 (l’API ne sert que l’assistance et l’optimiseur). Coût mesuré : 0 récit sur trois jours, 7 travaux morts, les deux audits arrêtés deux jours, et le rapport d’activité hebdomadaire du 11/09 toujours pas rédigé le 13 à 15 h — le seul de ces effets qu’un client peut voir. Aujourd’hui les travaux du poste n’ont aucun chemin vers l’API : recharger seul ne suffit pas, il faut aussi que le serveur rédige lui-même quand la CLI est au plafond (une journée de code). Le courrier coûterait environ 3 $ par mois en Sonnet ; les récits, environ 3 $ par jour de plafond. Ce que je recommande : recharger 20 $ et coder le repli pour le courrier seulement — c’est lui qui porte les rapports, et il est léger.","options":[{"v":"courrier","l":"Recharger 20 $ — repli du courrier seulement"},{"v":"tout","l":"Recharger — repli du courrier et des récits"},{"v":"non","l":"Non : tout attend la remise à zéro"}],"tranchee":{"le":"13/09","choix":"non","note":"Non alors j'ai fait une erreur j'ai oublié de payé et je suis parti en vacance donc ca à bloqué mais je n'aurai plus d'erreur de ce genre, donc tout prio au agent locaux et ne pas switch sur un solution API !","suite":"Aucun repli API ne sera codé. T1 n’est plus bloquante : elle ne concerne plus que l’assistance et l’optimiseur."}},{"id":"D4","sujet":"Un récit pour quels trajets","texte":"Les récits sont le premier volume automatisé de l’abonnement : ~200 appels par jour en Sonnet, un par trajet analysé. Sur sept jours, 27 % des récits décrivent des trajets de moins de 3 km, 9 % de moins d’un kilomètre — des manœuvres de parking racontées en trois phrases. Ne pas les narrer ne retire rien à l’analyse, ni aux rapports, ni aux alertes : seul le texte manque. Ce que je recommande : au-delà d’un kilomètre — le gain est sûr et personne ne relira le récit d’un déplacement de 600 m.","options":[{"v":"tous","l":"Tous les trajets (comme aujourd’hui)"},{"v":"1km","l":"Au-delà d’un kilomètre (−9 %)"},{"v":"3km","l":"Au-delà de trois kilomètres (−27 %)"}],"tranchee":{"le":"13/09","choix":"tous","note":"Faire le récit tout de le monde, faire le rattrapage car j'ai eu un bug d'agent IA pour 3 jours donc bien faire le récit de tout les trajets !","suite":"Fait : 0 trajet sans récit sur toute la rétention le 13/09 à 17 h 28 UTC (555 récits écrits dans la journée) — T37 close. Et T36 a corrigé ce qui tuait les passages du rattrapage."}},{"id":"D5","sujet":"Le poste doit-il savoir qu’il est au plafond","texte":"Pendant le plafond, les agents ont essayé 36 fois pour rien — un passage toutes les deux heures, chacun avec son contrôle de session et sa ligne d’échec — alors que la CLI annonce l’heure de remise à zéro dans son message dès la première fois. Le geste : à la première réponse « plafond », l’unique porte vers la CLI (cli-claude.cjs) retient l’heure annoncée et refuse d’appeler jusque-là ; les agents sortent aussitôt en disant pourquoi, la sentinelle n’écrit qu’une ligne (c’est déjà le cas depuis T31), et tout repart seul à l’heure dite. Zéro perte, zéro risque : un marqueur périmé se lève au premier appel qui passe. Ce que je recommande : oui, je le code dans la foulée.","options":[{"v":"oui","l":"Oui — les agents s’arrêtent d’eux-mêmes jusqu’à l’heure annoncée"},{"v":"non","l":"Non — laisser essayer toutes les deux heures"}],"tranchee":{"le":"13/09","choix":"oui","note":"Si échoue par exemple 5 heures d'affilé alors stoppé mais par contre bien faire un mails et aussi une page pour tout redémarrer ! (dans admin de tracky et dans les truc automatiser !)","suite":"Fait : T34 déployée le 13/09 à 17 h 37 UTC et vérifiée sur une pause posée à la main — les agents sortent en une seconde, un courriel est parti à 17 h 50, le bouton « Reprendre maintenant » de /admin l’a levée. Reste à voir au prochain vrai plafond."}},{"id":"D6","sujet":"Le modèle des deux audits quotidiens","texte":"Les audits du centre d’alerte (03:09) et du VPS (04:21) durent ~35 min chacun et tournent en Opus, faute de modèle fixé : ce sont les plus gros consommateurs automatisés de l’abonnement, et ils sont aussi les premiers à s’arrêter au plafond. Sonnet pèse environ cinq fois moins sur la limite hebdomadaire. L’audit VPS est mécanique — collecte, comparaison, constats — et s’en accommoderait ; celui du centre d’alerte écrit les fiches, décide des tâches et alimente cette page, sa qualité compte. Ce que je recommande : Sonnet pour le VPS, Opus pour le centre d’alerte.","options":[{"v":"opus","l":"Opus pour les deux (aujourd’hui)"},{"v":"mixte","l":"Sonnet pour le VPS, Opus pour le centre d’alerte"},{"v":"sonnet","l":"Sonnet pour les deux"}],"tranchee":{"le":"13/09","choix":"opus","note":"On reste sur Opus, j'ai eu un bugs pour le budget mais ca ne ce reproduira plus ne t'en fait pas !","suite":"Inchangé : les deux audits restent en Opus."}},{"id":"D7","sujet":"Un abonnement à part pour les agents du poste","texte":"Le plafond a été atteint parce que tes sessions de développement et la production partagent la même limite hebdomadaire : une grosse semaine de travail affame les récits et le courrier. Un second compte, réservé aux agents de la CLI (récits, courrier — les audits restent sur le tien, ils tournent dans ton application), les isolerait : environ 20 $ par mois en Pro, si ses limites suffisent aux ~200 récits quotidiens — à mesurer une semaine avant de conclure. Ce que je recommande : pas maintenant. D4, D5 et D6 réduisent la pression ; si un second plafond survient malgré elles, on ouvre ce compte.","options":[{"v":"oui","l":"Oui, ouvrir un second compte pour les agents"},{"v":"plus-tard","l":"Pas maintenant — d’abord D4, D5, D6"}],"tranchee":{"le":"13/09","choix":"oui","note":"Tu as raison c'est une bonne solution mais pas pour le moment on va reste sur la solution actuel, par contre cette tache laisse la moi dans les choses a faire pour ne pas oublié !","suite":"Pas maintenant, par ton choix : T35 le garde dans ce qui t’attend, sans urgence, pour ne pas l’oublier."}},{"id":"D8","sujet":"Les quatre questions du coupe-circuit — tranchées par le chantier fiabilité ?","texte":"Rectification d’abord : la commande qui a échoué le 04/09 à 05 h 00 sur FG-669-DQ n’était pas une coupure mais une REMISE EN ROUTE — le véhicule avait été coupé la veille à 20 h 00 (acquittée), le relais SMS n’a pas répondu en dix secondes, le planificateur a réessayé une minute plus tard par SMS sans confirmation, et le véhicule n’a plus bougé jusqu’à ta vérification sur place le 12/09. C’est le cas (d), pas le cas (c). Sur 30 jours : près de 2 000 commandes moteur, une seule en échec franc, 154 « envoyées » jamais acquittées (dont 55 remises en route par SMS), et sur 731 soirs de coupure, 44 lendemains sans remise en route prouvée à 7 h. Depuis le 11/09 à 20 h 49 tu as coupé les 37 plannings, et le chantier fiabilité ouvert le 12/09 répond aux quatre questions : (a) les dix secondes restent, mais une remise en route est réessayée par des chemins indépendants jusqu’à confirmation ou escalade humaine ; (b) remise en route répétable et idempotente, coupure jamais rejouée après sa validité, idempotence garantie par le serveur ; (c) et (d) toute remise en route non confirmée est une alerte critique en moins de soixante secondes, et une coupure automatique est refusée si la voie de reprise est dégradée. Ce que je recommande : tenir T3 pour tranchée par ce chantier, et suivre la remise en service (T38) plutôt que rouvrir les questions.","options":[{"v":"chantier","l":"Oui — tranchées par le chantier fiabilité"},{"v":"revoir","l":"Non — je veux en rediscuter"},{"v":"attendre","l":"On attend le chantier en cours"}],"tranchee":{"le":"13/09","choix":"revoir","note":"Actuellement un chat boss sur cela donc on attend de voir ce qui va se faire !","suite":"Clic « je veux en rediscuter » le 13/09 à 23:54 (Paris) sur la page : T3 reste ouverte. Les quatre questions seront reprises avec toi une fois le chantier livré (T40 → T47), avec ce que la contre-expertise a tranché."}},{"id":"D9","sujet":"Qui doit recevoir les excès de vitesse","texte":"Deux sociétés armées (cdef31, mh cars), déjà réglées à +40 km/h sur la limite et 130 km/h absolu. Sur quatorze jours : 55 alertes, 49 chez mh cars (7 véhicules, jusqu’à 142 km/h), 6 chez cdef31 ; 58 % viennent du plafond absolu (130 à 142 km/h sur des routes à 110), 42 % de la règle des +40 ; 22 % étaient des doublons, que T30 supprime depuis le 13/09 — il en reste environ trois par jour. Depuis ce soir, plus aucun client ne reçoit de notification (ta consigne : super-admins seulement pendant les tests, T39 rappelle de rouvrir) ; l’administrateur de mh cars en recevait 7 à 8 par jour. Restent les deux super-administrateurs, qui reçoivent TOUTES les flottes : 7 à 9 excès par jour, plus 5 à 11 notifications de la sentinelle des agents pendant la panne de la semaine (T36 et T31 les réduisent). Ce que je recommande : couper les excès de vitesse dans les préférences des deux super-administrateurs (ils restent lisibles au centre d’alerte) et ne pas toucher aux seuils — relever le plafond à 140 tolérerait 139 km/h sur une route à 110.","options":[{"v":"super-admins","l":"Couper les excès pour les super-admins, garder les seuils"},{"v":"plafond-140","l":"Garder tout le monde, relever le plafond à 140"},{"v":"rien","l":"Ne rien changer — trois par jour, c’est vivable"}],"tranchee":{"le":"13/09","choix":"rien","note":"","suite":"T4 close : seuils et destinataires inchangés (les clients ne reçoivent rien pendant tes tests, T39). Les doublons sont partis avec T30 ; s’il reste trois excès par jour, c’est voulu — la sentinelle « destinataire saturé » pourra le redire, ce ne sera pas un défaut."}},{"id":"D10","sujet":"Committer le correctif P0 (clé RESTORE) sur la branche du chantier","texte":"Le correctif T40 est écrit dans le worktree du chantier (branche codex/tracky-cutoff-reliability-2026-09-12) : huit tests neufs, suites API et Web vertes, typechecks propres, aucun déploiement. Il n'est PAS committé : la règle de ce dépôt est qu'un commit part sur ta demande, et ce worktree est celui de Codex. Deux voies : committer maintenant sur la branche du chantier, puis enchaîner T46 (nettoyage du reformatage et rebase sur main) ; ou relire d'abord le diff (docs 19 et 20 le décrivent ligne à ligne). Ce que je recommande : committer maintenant — le diff est localisé (deux services, deux specs, l'env, un toast), et chaque jour sans lui est un jour où une RESTORE par SMS peut avaler celle du lendemain une fois la branche déployée.","options":[{"v":"commit","l":"Oui — committer maintenant sur la branche du chantier"},{"v":"relire","l":"Je relis le diff d'abord"},{"v":"non","l":"Non — attendre"}],"tranchee":{"le":"14/09","choix":"commit","note":"Oui, committe le correctif P0 sur la branche et enchaîne avec T46.","suite":"Fait dans la foulée : commit d5c19a17 sur la branche du chantier, historique nettoyé du reformatage, rebase sur main sans conflit (T46 close), suites vertes. Rien n'est déployé : T41, T42, T44, T45 puis T47 avant toute mise en ligne."}}],"faits":[{"d":"16/09","quoi":"Première nuit sur le chantier : 24/24 reprises acquittées à 07:00 en ≤ 5 s ; les coupes ont attendu la preuve de 04:30 — d'où T69 (preuve à 21:30 + push au propriétaire), déployé ce matin","preuve":"\u003ccode>engine_control_commands\u003c/code> : 24 CUT 02:31–02:59 UTC acquittés (0–5 s), 24 RESTORE 05:00:01–05:00:10 UTC acquittés (0–5 s, moyenne 3,1 s), 0 SMS, 0 relance ; \u003ccode>sms_logs\u003c/code> : \u003ccode>gateway_daily_proof\u003c/code> delivered à 02:30 et 04:30 UTC ; \u003ccode>error_logs\u003c/code> : 26 lignes \u003ccode>engine-control-interlock\u003c/code> de 20:00 à 02:24 UTC (une par quart d'heure), aucune \u003ccode>sms-daily-proof\u003c/code> ni \u003ccode>sms-gateway-watchdog\u003c/code> ni \u003ccode>engine-control-restore\u003c/code>. T69 = \u003ccode>87ae29c9\u003c/code> : 263 suites / 4 157 tests, déployé par \u003ccode>deploy.sh\u003c/code>."},{"d":"15/09","quoi":"Le chantier coupe-circuit est EN PRODUCTION : fenêtre jouée de 19:20 à 20:15 (prod fa9ff1d1 puis 0c9672c9, relais 724bcb8, kill-switch true)","preuve":"\u003ccode>journal.jsonl\u003c/code> : \u003ccode>fa9ff1d1\u003c/code> à 17:35:05 UTC (226 s) ; migrations \u003ccode>20260912110000\u003c/code> et \u003ccode>20260914150000\u003c/code> appliquées ; artefact vérifié dans le conteneur (T42, T45, T62, kill-switch) ; \u003ccode>/api/health\u003c/code> 200 ; 33 boîtiers reconnectés en TCP ; relais : \u003ccode>selection: configured\u003c/code>, SIM 1. Migration démontrée avant sur \u003ccode>tracky_copie\u003c/code> (0 erreur). Deux écarts vus et traités : le S21 hors ligne depuis 15:49 (sentinelle T44 en CRITICAL à 19:37, ping repris 19:51 après déblocage) ; la sentinelle T51 réveillant ~50 RESTORE FAILED historiques (correctif \u003ccode>0c9672c9\u003c/code> borné à 24 h, 148 tests, redéployé). Le build API est passé de 32 min à 4 min 21 une fois V28 tué."},{"d":"15/09","quoi":"Les tâches ont été optimisées : 20 fiches closes, 8 fusionnées dans 3 — il reste ce qui protège quelque chose et a un geste","preuve":"Closes parce que tranchées par le chantier déployé (T3, T21, T18, T43, T56, T54), non exerçables ou cosmétiques (T15, T19, T20, T14), faites ce soir (V28), déconseillées ou impossibles (V19, V22, V18), sans propriétaire (V20, V21), closes sur le fait (V27). Fusions : boîtiers muets / antennes / déclarations → T9 ; téléphone passerelle → T55 ; ménage du VPS → V17. V4 et V5 débloquées par V28."},{"d":"15/09","quoi":"Nuit du 14 au 15 sur l'ancien code : 24/24 coupes, 23/24 reprises — GS-928-NX immobilisé 2 h 56 en silence, réparé à la main","preuve":"\u003ccode>engine_control_commands\u003c/code> : 24 CUT TCP acquittées 20:00:01–20:00:12 UTC ; 24 RESTORE TCP à 05:00–05:01 UTC, 23 acquittées en ≤ 5 s, GS-928-NX \u003ccode>SENT_UNCONFIRMED\u003c/code> à 05:40 sans relance ni SMS (\u003ccode>sms_logs\u003c/code> vide) ni ligne au centre d'alerte ; positions : boîtier connecté toute la nuit, trois tentatives de démarrage 07:46–07:53 UTC (contact 1–5 s, 0 km/h), RESTORE manuelle du veilleur de nuit à 07:56:39 acquittée en 3 s, départ à 08:01, 39 km/h à 08:09. HM-769-GA jamais coupé (hors champ GPS, report de sécurité). Deux reprises manuelles nocturnes (23:13, 23:14) servies sans re-coupe."},{"d":"14/09","quoi":"🔴🔴 Les 30 plannings CDEF31 ont été réarmés par le client à 09:03 — sur l'ancien code : sans déploiement, 25 coupes ce soir à 22:00 comme le 11/09","preuve":"\u003ccode>vehicle_schedules\u003c/code> : 30/30 CDEF31 \u003ccode>enabled\u003c/code>, ligne de base \u003ccode>IN_WINDOW\u003c/code> posée au tick de 07:03:15 UTC ; \u003ccode>system_activity_logs\u003c/code> : \u003ccode>POST /api/fleet-schedules/bulk\u003c/code> à 07:03:16 UTC par le gestionnaire CDEF31 (deux aperçus juste avant). Production = \u003ccode>9afdf52a\u003c/code> : le kill-switch et l'interlock n'existent que dans le chantier (\u003ccode>01756db7\u003c/code>), jamais déployé. Cinq des trente boîtiers sont muets depuis 13 à 25 jours (dormance : le cron les ignore) ; les 25 autres sont vivants en TCP. Mesuré aussi pour la fenêtre : \u003ccode>NODE_ENV=production\u003c/code> dans le conteneur (kill-switch fail-closed effectif dès le déploiement), \u003ccode>env_file\u003c/code> transmet tout, le numéro de preuve est déjà dans l'allowlist (preuve hebdo remise à 07:00 UTC), un seul appareil enrôlé (Device ID facultatif)."},{"d":"14/09","quoi":"Fusionné : le chantier coupe-circuit est sur main (Tracky #138, relais #9), avec T62 « SIM injoignable = TCP seul » — il ne reste que la fenêtre de déploiement, ensemble","preuve":"Fusions en merge commit après \u003ccode>pnpm verify\u003c/code> sur la branche puis sur la branche fusionnée avec \u003ccode>origin/main\u003c/code> : typecheck vert, smoke 5/5, partagé 423, API \u003cb>262 suites / 4 145 tests\u003c/b>, web 740 ; relais 7/55. T62 (doc 35) répond à la question du jour : on ne sait pas encore \u003ci>où\u003c/i> deux SIM sont refusées (Free, le fournisseur ou la carte — un SMS depuis un autre opérateur tranche), mais le système le SAIT désormais : coupe automatique seulement boîtier connecté, remise en route en TCP toutes les 5 min et à chaque reconnexion, un SMS-sonde par 6 h, une ligne par jour. La routine du centre d'alerte lira les 24 h de preuve (six verdicts, T65). Production inchangée : \u003ccode>9afdf52a\u003c/code>."},{"d":"14/09","quoi":"Plus rien à coder sans toi : T58, T59, T60 committés sur main, la copie périmée retirée, la fiche de fusion écrite","preuve":"Sur \u003ccode>main\u003c/code> (local, non poussé) : \u003ccode>22ec4c1f\u003c/code> (T58 — la sentinelle des agents refroidit PAR CAUSE, et courrier-ia lit le premier objet JSON équilibré ; 56 + 7 tests), \u003ccode>25fa2af9\u003c/code> (T59 — un fetch avorté par la fermeture de la page ne remonte plus, le canal anonyme ne remonte que les bugs JS ; 8 tests, suite web 729), \u003ccode>c8fd9be8\u003c/code> (T60 — horloge figée). La branche du chantier fusionne proprement sur \u003ccode>origin/main\u003c/code> (\u003ccode>merge-tree\u003c/code> sans conflit, aucun fichier commun) ; la copie non suivie qui aurait masqué les vrais documents à la fusion est retirée. Doc 34 : les 27 commits Tracky et les 5 du relais, l'ordre de relecture en 2 h."},{"d":"14/09","quoi":"Le S21 est configuré et le prouve : un ping par minute — et les tests SMS renversent la conclusion du matin (T43, T61)","preuve":"Sur le téléphone, avec ton accord : ping \u003cb>60 s\u003c/b>, FIFO, délais 10/15 s, limite 60/h, Local server OFF, veille des applis OFF ; \u003ccode>lastSeen\u003c/code> avance de 60 s en 60 s depuis 09:23 (lu sur le serveur). Puis 13 SMS de statut \u003ccode>check123456\u003c/code> (facturés sur ta ligne — arrêtés à ta demande) : par le relais, \u003cb>8 des 10 SIM\u003c/b> que rien n'atteignait depuis des semaines répondent en quelques secondes (…621085, 36 échecs depuis juin : \u003cb>delivered en 8 s\u003c/b>) ; \u003cb>2 restent en échec\u003c/b> au départ, HD-584-BF et BP-434-RD, boîtiers pourtant en ligne, SIM activées, IMEI concordants. Le défaut du 11/09 tenait donc surtout à l'état du téléphone (pas de ping, app jamais redémarrée) ; pour ces deux véhicules, il reste un test « autre opérateur », à 1 SMS."},{"d":"14/09","quoi":"Le S21 diagnostiqué de l'intérieur : le bug du 11/09 a DEUX causes, et la seconde n'est pas dans le téléphone (T43, T61)","preuve":"Mobile connecté, lecture seule, 08:40–08:58. (1) Le téléphone ne relève les ordres que toutes les 15 min faute de ping : les 10 RESTORE de 07:00 sont partis à \u003cb>07:07\u003c/b>, et celui de 20:49 à \u003cb>21:55\u003c/b> parce que le S21 redémarrait (uptime 60 h = dernier redémarrage le 11/09 vers 20:45) — réglages de l'app tous au défaut (ping vide, LIFO, ni délai ni limite), veille des applis inutilisées ON sans protection, téléphone personnel sur batterie. (2) Les 5 échecs de 07:07 et toutes les reprises du jour sont « RESULT_ERROR_GENERIC_FAILURE » vers \u003cb>les mêmes numéros\u003c/b> : dix SIM de boîtiers n'ont \u003cb>jamais\u003c/b> reçu un SMS du S21 depuis juin (…621085 : 36 échecs) alors que leurs voisines livrent à 100 % dans la même seconde, que le fournisseur les dit activées, qu'elles sont en session data, en TCP, et qu'elles émettent des SMS. Ni débit, ni veille, ni batterie : la destination. Test décisif à faire (T61) : un SMS neutre vers …621085 depuis un autre opérateur. Vérifié aussi : le S21 se remet ses propres SMS (preuves hebdo), les 4 webhooks sont en place."},{"d":"14/09","quoi":"Le S21 est relevé avant d'y toucher : aucun réglage, pull toutes les 15 min, quatre webhooks bien en place (T43)","preuve":"Lecture seule depuis le conteneur du relais, 06:33 UTC : serveur capcom6 \u003ccode>1.43.0\u003c/code> sain ; un seul appareil, \u003ccode>lastSeen\u003c/code> vieux de \u003cb>10 min\u003c/b> (le pull de secours, faute de ping) ; \u003ccode>GET /3rdparty/v1/settings\u003c/code> rend \u003ccode>{}\u003c/code> — tout au défaut, comme le diagnostic du 12/09 ; les quatre webhooks \u003ccode>sms:received/sent/delivered/failed\u003c/code> pointent bien sur le relais (le point P4 du doc 25 est vérifié). Les gestes exacts sur le téléphone sont dans la fiche T43 ; la preuve sera \u003ccode>lastSeen\u003c/code> qui avance toutes les 60 s, écran éteint, pendant 30 min."},{"d":"14/09","quoi":"Les six derniers correctifs faisables seul sont committés : le chantier n'attend plus que toi (T48, T50, T51, T52, T53, T56)","preuve":"Tracky \u003ccode>8a8cb2c4\u003c/code> (T48) : une preuve ne se rétrograde jamais en « envoyée », une CUT orpheline est dispatchée. \u003ccode>b582fbf6\u003c/code> (T51) : une RESTORE non prouvée se rappelle toutes les \u003cb>15 min\u003c/b>, un SMS bloqué une heure est retenté, un clic manuel répond en 20 s. \u003ccode>428d1f39\u003c/code> (T52) : l'allowlist du relais ne bloque plus une remise en route. \u003ccode>8bb24ca7\u003c/code> (T50) : le glissement exige un vrai geste — un clic en bout de piste ou la touche Fin ne coupent plus rien (3 tests rouges sur l'ancien composant). \u003ccode>b407481a\u003c/code> (T53) : le journal des tentatives est enfin exercé, avec les contraintes de la migration rejouées, et le changement d'heure du \u003cb>25/10\u003c/b> est couvert. \u003ccode>0677cd05\u003c/code> (T56) : chaque promesse des documents 01–18 est datée « tenu / tenu autrement / non implémenté » (doc 32). Suites : API \u003cb>260 suites / 4 081 tests\u003c/b>, web 732, smoke 5, typecheck vert ; rien n'est déployé. Non vérifié : rejeu des migrations sur PostGIS 16 réel (Docker éteint ici), annulation SMS effective (capcom6 ≥ 1.45.0)."},{"d":"14/09","quoi":"Une coupe retenue par le garde-fou ne remplit plus le centre d'alerte (T49)","preuve":"Tracky \u003ccode>93dba465\u003c/code> : le kill-switch écrit \u003cb>une\u003c/b> ligne par heure (niveau dégradation : état voulu, pas de courriel) avec le compte des refus et les plaques ; l'interlock une ligne CRITICAL par raison et par quart d'heure ; le cron ne compte plus une coupe retenue comme un blocage. Avant : un CRITICAL par appel, trente véhicules, palier 2/5/15/30 min, un courriel par heure. \u003cb>8 tests\u003c/b> ; rien n'est déployé."},{"d":"14/09","quoi":"La procédure de déploiement est écrite, et la migration a été jouée sur un vrai PostgreSQL avant de l'être sur le tien (T47)","preuve":"Tracky \u003ccode>fde25b96\u003c/code>, relais \u003ccode>0bb4013\u003c/code>. Doc 25 : téléphone → relais → Tracky par \u003ccode>deploy.sh\u003c/code>, sauvegardes des trois bases, migration rejouée sur une copie AVANT la production, 24 h de preuve, rollback par couche, liste Go/No-Go. Démontré en local avec le même Prisma : la migration à l'horodatage « d'avant » s'applique bien après celles déjà déployées. Trouvé au passage : l'image du serveur SMS n'était pas épinglée — \u003ccode>latest\u003c/code> valait \u003cb>v1.47.4\u003c/b> quand la production tourne en \u003cb>v1.43.0\u003c/b> ; c'est corrigé. Rien n'est déployé : la procédure attend le téléphone (T43) et ta relecture."},{"d":"14/09","quoi":"Chaque matin, une preuve que les SMS partent — et le relais dit enfin ce qu'il sait (T45)","preuve":"Relais \u003ccode>ae17b34\u003c/code> : \u003ccode>sent\u003c/code> / \u003ccode>delivered\u003c/code> / \u003ccode>failed\u003c/code> / \u003ccode>cancelled\u003c/code> poussés à Tracky sur \u003ccode>/sms/webhook/status\u003c/code>, signés, avec retries. Tracky \u003ccode>1aa1e0f9\u003c/code> : preuve SMS à \u003cb>04:30\u003c/b> et \u003cb>06:30\u003c/b>, verdict à +15 min, écho entrant reconnu comme remise ; sans preuve, une ligne qui dit « les coupes du soir seront refusées ». C'est ce qui manquait à l'interlock six jours sur sept. \u003cb>20 tests\u003c/b> ajoutés, suites vertes ; rien n'est déployé. Non vérifié : l'auto-envoi du S21 vers son propre numéro."},{"d":"14/09","quoi":"La sentinelle du téléphone ne crie plus à chaque pull — et son verdict porte sur le bon téléphone (T44)","preuve":"Relais \u003ccode>784d766\u003c/code> : santé jugée sur \u003cb>un\u003c/b> appareil (\u003ccode>CAPCOM6_DEVICE_ID\u003c/code>), quatre états ONLINE / STALE / OFFLINE / UNKNOWN, cartes SIM exposées, réglages bornés (999999999 s ne désactive plus rien), délai d'envoi séparé. Tracky \u003ccode>86a2fc53\u003c/code> : \u003cb>2\u003c/b> contrôles mauvais pour ouvrir un épisode, \u003cb>3\u003c/b> sains pour le fermer, rappel toutes les 15 min — une alerte au lieu de quatre par heure ; l'écran /admin dit \u003ci>pourquoi\u003c/i>. \u003cb>27 tests\u003c/b> ajoutés ou réécrits, suites vertes ; rien n'est déployé."},{"d":"14/09","quoi":"Un boîtier qui revient en ligne reçoit sa remise en route — et une remise en route n'est plus jamais abandonnée (T42)","preuve":"Tracky \u003ccode>86c32fa9\u003c/code> : le registre de sockets annonce chaque reconnexion ; la dernière RESTORE non prouvée du boîtier (moins de 24 h, sans coupure demandée depuis) repart aussitôt en TCP — même si elle était « en échec » ou « nul ne sait ». Trois SMS refusés ne ferment plus rien : \u003cb>K\u003c/b> repart en TCP à chaque reconnexion et toutes les \u003cb>30 min\u003c/b>, sans un SMS de plus. Et une RESTORE ne renvoie \u003cb>jamais\u003c/b> K après le J du soir. \u003cb>18 tests\u003c/b> ajoutés, suites vertes ; rien n'est déployé."},{"d":"14/09","quoi":"Une coupure par SMS a désormais une date de péremption — et une remise en route passe devant tout (T41)","preuve":"Relais \u003ccode>2536ea4\u003c/code> : \u003ccode>ttlSeconds\u003c/code> et \u003ccode>priority\u003c/code> transmis au serveur SMS, appareil explicite, accusé de remise toujours demandé, \u003ccode>DELETE /v1/texto/:id\u003c/code> pour retirer un SMS encore en attente. Tracky \u003ccode>8ab1d08e\u003c/code> : un \u003ccode>stop\u003c/code> périme après \u003cb>15 min\u003c/b> sur le téléphone, un \u003ccode>resume\u003c/code> part en priorité 100, et une RESTORE qui supplante une CUT fait annuler son SMS. Vérifié sur le contrat public : le serveur 1.43.0 de production connaît déjà ttl, priority et deviceId ; l'annulation demande un serveur ≥ 1.45.0 (T47). \u003cb>16 tests\u003c/b> ajoutés, suites vertes ; rien n'est déployé."},{"d":"14/09","quoi":"Le P0 du coupe-circuit est committé, la branche du chantier est propre et rebasée sur main","preuve":"Commit \u003ccode>d5c19a17\u003c/code> sur la branche du chantier après ta décision D10. Le reformatage prettier qui gonflait le diff (1 315 lignes pour 16 fonctionnelles sur le catalogue) a été retiré en reconstruisant l'historique — contenu vérifié identique par normalisation — puis \u003ccode>git rebase main\u003c/code> : \u003cb>7 commits, zéro conflit\u003c/b>. Le relais Texto a subi le même nettoyage (un commit \u003ccode>2de94d8\u003c/code> sur \u003ccode>origin/main\u003c/code>, guillemets du dépôt). Suites après rebase : \u003cb>4 002\u003c/b> tests API, 727 Web, 423 partagé, 24 Texto. Rien n'est déployé : la production reste sur \u003ccode>66d286f5\u003c/code>."},{"d":"13/09","quoi":"Le chantier fiabilité passé à la contre-expertise : NO-GO, un P0 démontré — et corrigé le soir même","preuve":"Revue indépendante des deux branches (doc 19) : suites reproduites (\u003cb>3 920\u003c/b> tests API, 727 Web, 416 partagé, 24 Texto), diff normalisé (1 315 lignes brutes → \u003cb>16 fonctionnelles\u003c/b> sur le catalogue), VPS lu sans rien toucher (\u003ccode>lastSeen\u003c/code> du téléphone figé \u003cb>552 s\u003c/b> au repos, serveur capcom6 1.43.0 dont \u003ccode>/health\u003c/code> ne teste que la base). Le défaut principal — une RESTORE d'hier qui avale celle du lendemain — a été \u003cb>prouvé par un test contre le service réel\u003c/b>, puis corrigé dans le worktree avec huit tests neufs (doc 20). Rien n'est déployé : la production reste sur \u003ccode>66d286f5\u003c/code>."},{"d":"13/09","quoi":"Les notifications ne partent plus qu’aux super-admins — et une commande SMS a enfin une fin de vie","preuve":"Ta consigne du soir : personne d’autre que toi pendant les tests. Trois comptes clients avaient reçu \u003cb>88 alertes push en 30 jours\u003c/b> (mh cars 63 excès de vitesse) parce que le périmètre valait « tout le monde » : ramené aux super-admins à 20 h 25 UTC. Même déploiement : les deux commandes SMS du 1er septembre, « envoyées » depuis \u003cb>298 heures\u003c/b>, sont passées « envoyée, sans réponse » au premier balayage (T5)."},{"d":"13/09","quoi":"Le poste sait qu’il est au plafond : les agents s’arrêtent, un courriel part, un bouton relance","preuve":"Pause posée à la main à 17 h 41 UTC : le courrier lancé dans la foulée est sorti en \u003cb>une seconde\u003c/b> sans toucher aux huit travaux en file ; au contrôle de 17 h 50, \u003cb>un courriel\u003c/b> (livré) et \u003cb>une seule ligne\u003c/b> au centre d’alerte ; « Reprendre maintenant » a rendu \u003ccode>levées : 1\u003c/code> et le bandeau a disparu. Décision D5 tenue le jour même."},{"d":"13/09","quoi":"Les trois jours de plafond ont leurs récits — et le rattrapage ne meurt plus d’un Ctrl-C","preuve":"\u003cb>555 récits\u003c/b> écrits le 13/09, \u003cb>0 trajet sans récit\u003c/b> sur toute la rétention à 17 h 28 UTC. Le dernier passage (119 récits en 82 min) est le premier lancé sans fenêtre : il a fini par sa propre ligne de fin, quand les quatre passages tués plus tôt dans la journée n’avaient laissé aucune trace. Le courrier a livré ses huit travaux en attente le soir même (18 h 01 UTC) et le \u003cb>rapport d’activité du 4 → 11/09\u003c/b> — le seul effet du plafond qu’un client pouvait voir — est écrit à 18 h 20."},{"d":"13/09","quoi":"Le témoin des tâches planifiées sait se taire","preuve":"Quatre CRITICAL ouvertes depuis le 6 septembre — 164 heures — se sont archivées seules au contrôle de 13:35, note « Tâche repassée … (résolution automatique) ». Le témoin crie toujours sur une tâche vraiment arrêtée : une ligne écrite après le dernier passage n’est jamais touchée."},{"d":"13/09","quoi":"Le script de déploiement est incontournable","preuve":"Un contournement volontaire — l’API recréée à la main à 12:55 UTC — a produit la ligne « Déploiement hors script » au centre d’alerte \u003cb>109 s plus tard\u003c/b>, avec le sha, l’heure et l’auteur du dernier déploiement légitime. La garde est relue juste avant la recréation, les repères de repli sont posés seuls. Décision D1 tenue le jour même."},{"d":"09/09","quoi":"La sentinelle nomme des boîtiers, plus des flottes","preuve":"Passage de 06:30 : quatre véhicules nommés avec leur part — FV-941-LZ à 84 %, GA-490-SJ à 64 % — et \u003cb>silence pour cdef31\u003c/b>, qui recevait un message la veille. Le rejeu de la règle en SQL donne exactement les mêmes."},{"d":"09/09","quoi":"La ligne au départ attrape un vrai incident","preuve":"Un déploiement pendant le passage de 19:45 l’a tué. Marqué \u003ccode>interrupted\u003c/code>, e-mail livré à 19:50, travail rattrapé au passage suivant. Avant le 08/09, il aurait disparu sans une ligne."},{"d":"08/09","quoi":"L’alerte qui se répétait toutes les heures est éteinte","preuve":"Un trajet du 8 juillet, sans positions conservées, criait une fois par heure depuis 27 h. \u003cb>Zéro ligne depuis\u003c/b>, sur 30 heures."},{"d":"08/09","quoi":"Le recalage des tracés est réparé pour les trajets neufs","preuve":"\u003cb>224 trajets sur 224\u003c/b> clôturés depuis le correctif suivent la route. Avant : 156 sur 1 217."},{"d":"08/09","quoi":"Une seule erreur critique suffit à prévenir","preuve":"Cinq e-mails livrés en deux jours, un par erreur, refroidissement respecté. Avant, il en fallait cinq dans l’heure."},{"d":"08/09","quoi":"Les fonds de carte ne dépendent plus de CARTO","preuve":"Plus aucune tuile « API KEY REQUIRED » en travers de la carte : zéro URL \u003ccode>cartocdn\u003c/code> dans le paquet servi."},{"d":"07-08/09","quoi":"Chantier cartes — échelle de vitesse unique, traînées, légendes, repères fixes","preuve":"Six tâches et trois défauts de recette, passés par les cinq niveaux jusqu’à la mesure en production."}],"faitsClos":59,"rangement":[{"nom":"docs/SUIVI.md","texte":"Le même contenu que cette page, dans le dépôt."},{"nom":"centre-alerte/app/taches.json","texte":"La source des tâches. Cette page en est une vue."},{"nom":"centre-alerte/ROADMAP-CORRECTIFS.md","texte":"Le pourquoi de chaque fiche, tenu chaque nuit."},{"nom":"docs/README.md","texte":"L’index : vivant, servi par l’API, ou archive."}]}</script>

    });
    h += '</div></section>';

    /* ── Ce qui t'attend ── */
    var aTrancher = DECISIONS.filter(function (d) { return !reponse(d); });
    var prises = DECISIONS.filter(function (d) { return !!reponse(d); });
    var nA = aTrancher.length;
    h += '<section class="section" id="toi"><div class="section__tete"><h2>Ce qui t’attend</h2><span class="compte" id="compte-toi">' + reste(TOI) + (reste(TOI) > 1 ? ' gestes' : ' geste') + (nA ? ' · ' + nA + (nA > 1 ? ' décisions' : ' décision') : '') + '</span></div>';
    h += '<p class="intro">' + TOI.length + (TOI.length > 1 ? ' gestes' : ' geste') + ' que le code ne peut pas faire, dans l’ordre où ils débloquent le reste. Les triangles marquent ce qui bloque en amont.</p>';
    h += '<div class="liste">';
    TOI.forEach(function (t) { h += ligne(t, '<span class="chip chip--alerte">toi</span>'); });
    h += '</div>';

    /* Seules les questions ENCORE OUVERTES restent ici, avec leurs boutons. Une question
       tranchée quitte cette section — demande du propriétaire (13/09) — et rejoint « Décisions
       prises », plus bas, où elle se lit sans pouvoir être recliquée par mégarde. */
    if (nA) {
      h += '<p class="intro" style="margin-top:6px">Et ' + nA + (nA > 1 ? ' questions à trancher' : ' question à trancher') + '. Réponds ici : je lis la page, et ma recommandation est dans chaque texte.</p>';
      h += '<div class="decisions">';
      aTrancher.forEach(function (d) {
        var r = etat.decisions[d.id] || {};
        h += '<article class="decision">';
        h += '<div class="decision__tete"><span class="decision__ref">' + d.id + '</span><h3 class="decision__sujet">' + ech(d.sujet) + '</h3></div>';
        h += '<p class="decision__texte">' + ech(d.texte) + '</p>';
        h += '<div class="options">';
        d.options.forEach(function (o) {
          h += '<button class="opt" data-act="decision" data-id="' + d.id + '" data-val="' + o.v + '" aria-pressed="false"><span class="puce"></span>' + ech(o.l) + '</button>';
        });
        h += '</div>';
        h += '<textarea data-act="note" data-id="' + d.id + '" aria-label="Votre réponse à ' + d.id + '" placeholder="Ou dis-moi autre chose">' + ech(r.note || '') + '</textarea>';
        h += '</article>';
      });
      h += '</div>';
    } else if (DECISIONS.length) {
      h += '<p class="intro" style="margin-top:6px">Aucune question en attente — tes décisions sont <a href="#decisions">plus bas</a>.</p>';
    }
    h += '</section>';

    /* ── Décisions prises ── */
    if (prises.length) {
      h += '<section class="section" id="decisions"><div class="section__tete"><h2>Décisions prises</h2><span class="compte">' + prises.length + ' sur ' + DECISIONS.length + '</span></div>';
      h += '<p class="intro">Ce que tu as tranché, avec tes mots, et ce que j’en fais. Pour revenir sur l’une d’elles, dis-le moi.</p>';
      h += '<div class="decisions">';
      prises.forEach(function (d) {
        var r = reponse(d), t = d.tranchee || {};
        h += '<article class="decision est-tranchee decision--prise">';
        h += '<div class="decision__tete"><span class="decision__ref">' + d.id + (t.le ? ' · ' + ech(t.le) : '') + '</span><h3 class="decision__sujet">' + ech(d.sujet) + '</h3><span class="chip chip--accent">' + ech(libelleChoix(d, r.choix)) + '</span></div>';
        if (r.note) h += '<p class="decision__note">«&nbsp;' + ech(r.note) + '&nbsp;»</p>';
        if (t.suite) h += '<p class="decision__suite">' + ech(t.suite) + '</p>';
        h += '</article>';
      });
      h += '</div></section>';
    }

    /* ── Ce que je code ── */
    h += '<section class="section" id="moi"><div class="section__tete"><h2>Ce que je peux coder</h2><span class="compte" id="compte-moi">' + reste(MOI) + ' sur ' + MOI.length + '</span></div>';
    h += '<p class="intro">Par ordre d’utilité. Dis-m’en un, je le prends.</p>';
    h += '<div class="liste">';
    MOI.forEach(function (t) { h += ligne(t, '<span class="chip chip--accent">à coder</span>'); });
    h += '</div></section>';

    /* ── On guette ── */
    h += '<section class="section" id="guette"><div class="section__tete"><h2>Ce qu’on guette</h2><span class="compte">rien à faire</span></div>';
    h += '<p class="intro">Des correctifs en ligne qui attendent leur occasion, et des tâches qu’un prérequis retient. Rien à faire : la mesure tombe toute seule, et la pastille dit laquelle des deux raisons s’applique.</p>';
    h += '<div class="liste">';
    GUETTE.forEach(function (g) {
      h += '<div class="ligne est-lecture">';
      h += '<span class="ligne__puce" aria-hidden="true">◷</span>';
      h += '<span class="ligne__ref">' + ech(g.id) + '</span>';
      h += '<span class="ligne__quoi">' + ech(g.quoi) + '</span>';
      h += '<span class="ligne__chip"><span class="chip chip--calme">' + ech(g.quand) + '</span></span>';
      h += '</div>';
    });
    h += '</div></section>';

    /* ── VPS ── */
    h += '<section class="section" id="vps"><div class="section__tete"><h2>Côté VPS</h2><span class="compte">' + VPS.length + (VPS.length > 1 ? ' constats' : ' constat') + '</span></div>';
    h += '<p class="intro">Presque tous des gestes d’infrastructure, du plus grave au moins grave.</p>';
    h += '<div class="liste">';
    VPS.forEach(function (v) {
      h += '<div class="ligne est-lecture">';
      h += '<span class="ligne__puce" aria-hidden="true">▪</span>';
      h += '<span class="ligne__ref">' + ech(v.id) + '</span>';
      h += '<span class="ligne__quoi">' + ech(v.quoi) + '</span>';
      h += '<span class="ligne__chip"><span class="chip chip--neutre">infra</span></span>';
      h += '</div>';
    });
    h += '</div></section>';

    /* ── Fait et prouvé ── */
    h += '<section class="section" id="faits"><div class="section__tete"><h2>Fait et prouvé</h2><span class="compte">' + FAITS.length + ' racontés · ' + FAITS_CLOS + ' tâches closes</span></div>';
    h += '<p class="intro">« Prouvé » veut dire mesuré sur la production, pas déployé. Un correctif déployé qu’aucun événement n’exerce reste un correctif non prouvé.</p>';
    h += '<div class="faits">';
    FAITS.forEach(function (f) {
      h += '<div class="fait"><span class="fait__date">' + ech(f.d) + '</span><span class="fait__quoi">' + ech(f.quoi) + '</span><p class="fait__preuve">' + f.preuve + '</p></div>';
    });
    h += '</div></section>';

    /* ── Où vit quoi ── */
    h += '<section class="section" id="rangement"><div class="section__tete"><h2>Où vit quoi</h2></div>';
    h += '<p class="intro">Cette page est le résumé. La trace complète est dans le dépôt.</p>';
    h += '<div class="rangement">';
    RANGEMENT.forEach(function (r) {
      h += '<div class="rangement__item"><span class="rangement__nom">' + ech(r.nom) + '</span><span class="rangement__texte">' + ech(r.texte) + '</span></div>';
    });
    h += '</div></section>';

    racine.innerHTML = h;
    majBarre();
  }

  /* ── Barre du bas ── */
  function majBarre() {
    var total = TOI.length + DECISIONS.length + MOI.length;
    var fini = TOI.filter(function (t) { return faite(t.id); }).length
             + MOI.filter(function (t) { return faite(t.id); }).length
             + (DECISIONS.length - decisionsRestantes());
    var pct = total ? Math.round(fini / total * 100) : 0;
    var barre = document.getElementById('barre');
    if (!barre) {
      barre = document.createElement('div');
      barre.className = 'barre'; barre.id = 'barre';
      document.body.appendChild(barre);
    }
    barre.innerHTML = '<div class="barre__contenu">'
      + '<div class="avancee"><div class="avancee__texte"><span>' + fini + ' sur ' + total + ' traités</span><span class="mono">' + pct + ' %</span></div>'
      + '<div class="piste"><div class="piste__valeur" style="width:' + pct + '%"></div></div></div>'
      + '<span class="sauvegarde" id="sauvegarde">état gardé sur cet appareil</span>'
      + '</div>';
  }

  function dire(texte, classe) {
    var el = document.getElementById('sauvegarde');
    if (!el) return;
    el.textContent = texte;
    el.className = 'sauvegarde' + (classe ? ' ' + classe : '');
  }

  /* ── Enregistrement ── */
  function enregistrer() {
    etat.maj = new Date().toISOString();
    try { localStorage.setItem('tracky-poste', JSON.stringify(etat)); } catch (e) {}
    if (!artefact) { dire('état gardé sur cet appareil'); return; }
    dire('enregistrement…');
    clearTimeout(minuteur);
    minuteur = setTimeout(publier, 700);
  }

  function publier() {
    if (!artefact || enCours) return;
    enCours = true;
    var doc = document.documentElement.cloneNode(true);
    var bloc = doc.querySelector('#etat');
    /* ⚠️ `outerHTML` ne rééchappe RIEN dans un <script> : une note contenant une balise
       fermante casserait la page publiée en deux. On échappe « < » — JSON.parse le rend tel
       quel à la relecture, et la balise ne peut plus apparaître. */
    if (bloc) bloc.textContent = JSON.stringify(etat).replace(/</g, '\\u003c');
    var barre = doc.querySelector('#barre');
    if (barre) barre.remove();
    var r = doc.querySelector('#racine');
    if (r) r.innerHTML = '';
    artefact.publish('<!doctype html>' + doc.outerHTML).then(function () {
      enCours = false;
      dire('enregistré pour tout le monde', 'est-ok');
    }).catch(function (err) {
      enCours = false;
      var code = err && err.code;
      if (code === 'conflict') { dire('une autre version a gagné', 'est-erreur'); return; }
      if (code === 'not_granted' || code === 'not_writer') { artefact = null; dire('état gardé sur cet appareil'); return; }
      dire('gardé ici seulement', 'est-erreur');
    });
  }

  /* ── Interactions ── */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.tagName === 'TEXTAREA') return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'tache') {
      etat.taches[id] = !etat.taches[id];
      rendre(); enregistrer();
    } else if (act === 'decision') {
      var d = decision(id), v = b.getAttribute('data-val');
      d.choix = d.choix === v ? '' : v;
      rendre(); enregistrer();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.tagName !== 'TEXTAREA' || t.getAttribute('data-act') !== 'note') return;
    decision(t.getAttribute('data-id')).note = t.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { enregistrer(); }, 900);
  });

  rendre();

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (a) {
      if (a) { artefact = a; dire('prêt — les coches sont partagées'); }
    }).catch(function () {});
  }
})();
</script>
