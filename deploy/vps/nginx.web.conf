server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Angular SPA routing — fallback vers index.html pour toute route non trouvée
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── PWA service worker : JAMAIS de cache ───────────────────────────────
    # Bug critique en prod : sans ces exceptions, ngsw-worker.js etait cappe
    # 1 an immutable par la regle ci-dessous, donc le SW ne pouvait pas se
    # mettre a jour cote client. Resultat : les clients restaient bloques sur
    # une vieille version meme apres deploy. Idem ngsw.json (le manifeste de
    # version que le SW lit pour detecter une nouvelle version).
    # Doit imperativement etre AVANT la regle generique sur les .js.
    location = /ngsw-worker.js          { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires off; }
    location = /ngsw.json               { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires off; }
    location = /safety-worker.js        { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires off; }
    location = /worker-basic.min.js     { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires off; }

    # Cache long pour assets hashés (les chunks ont un hash dans leur nom,
    # donc immutable est safe : tout changement => nouveau nom de fichier)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pas de cache sur index.html (pour les déploiements)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
