name: tracky-prod

networks:
  foodsqan-public:
    external: true
    name: ${TRAEFIK_NETWORK}
  vizyo-auth-network:
    external: true
    name: vizyo-auth-network
  vizyo-tracky:
    driver: bridge
    name: vizyo-tracky

volumes:
  tracky-postgres-data:
    name: tracky-postgres-data
  tracky-redis-data:
    name: tracky-redis-data
  tracky-api-logs:
    name: tracky-api-logs

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: tracky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tracky-postgres-data:/var/lib/postgresql/data
      - ../../docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    networks:
      - vizyo-tracky
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # 30 s et non 10 s (constat VPS-011). Chaque `pg_isready` ne coute pas « une commande » :
      # il declenche une chaine `runc exec` complete (~5 processus) ET fait forker un backend
      # PostgreSQL. A 10 s, cette seule sonde produisait 8 640 connexions par jour.
      #
      # 30 s reste largement suffisant pour detecter une base tombee : le `start_period` de
      # 30 s et les 10 tentatives couvrent le demarrage, et rien dans Tracky ne depend d'une
      # detection en moins d'une demi-minute.
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

    # ── Limite memoire (constat VPS-005) ──
    # Aucun conteneur n'en avait. Sans plafond, l'OOM killer du noyau choisit sa victime selon
    # un score de memoire, PAS selon l'importance metier : une fuite dans un conteneur de
    # developpement pouvait faire tomber la base de production.
    #
    # Les valeurs sont VOLONTAIREMENT GENEREUSES (5 a 15x l'usage observe). Le but est de
    # confiner une fuite, pas d'optimiser au plus juste : une limite trop basse transforme un
    # pic normal en redemarrage.
    deploy:
      resources:
        limits:
          memory: 1536m

  redis:
    image: redis:7-alpine
    container_name: tracky-redis
    restart: unless-stopped
    # `maxmemory` + `allkeys-lru` (constat VPS-005) : sans borne, Redis grandit jusqu'a ce que
    # la MACHINE cede, et sa politique `noeviction` par defaut refuse alors les ecritures au
    # lieu d'oublier les vieilles cles. Autrement dit : c'est le cache qui decide quand tout
    # le monde s'arrete. 256 Mo est tres large — l'usage observe est de 1,1 Mo.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - tracky-redis-data:/data
    networks:
      - vizyo-tracky
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # 30 s et non 10 s (constat VPS-011) : meme raisonnement que pour Postgres ci-dessus.
      interval: 30s
      timeout: 3s
      retries: 5

    # Limite memoire (VPS-005) — usage observe 1,1 Mo ; le `maxmemory 256mb` interne borne deja les donnees
    deploy:
      resources:
        limits:
          memory: 384m

  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    image: tracky-api:latest
    container_name: tracky-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tracky-postgres:5432/${POSTGRES_DB}?schema=public&application_name=tracky-api&connection_limit=10
      # TRK-035 — application_name : SANS LUI, LE JOURNAL NE PEUT PAS NOMMER L APPELANT.
      # La journalisation des connexions posee le 25/08 sert a identifier un tiers apres coup.
      # Elle montrait 544 connexions depuis 172.23.0.3 sans pouvoir dire QUI : la sonde de sante,
      # elle, se nommait deja (pg_isready). Postgres inscrit application_name sur chaque ligne
      # << connection authorized >>, donc ce simple libelle rend le trafic applicatif attribuable.
      #
      # connection_limit : la valeur EXPLICITE remplace un defaut DERIVE DU NOMBRE DE COEURS
      # (Prisma : 2*cpus+1, soit 5 sur ce VPS a 2 vCPU). Un redimensionnement du VPS changerait
      # donc le pool en silence. 10 sur 97 connexions utilisables (max_connections=100 moins 3
      # reservees) laisse une marge confortable.
      # /!\ CE N EST PAS UN CORRECTIF DE PANNE : mesure le 25/08, le pool de 5 n etait PAS sature
      # (0 erreur << timed out fetching a connection >> dans les journaux API, 0 en 90 jours de
      # error_logs). L effet sur le churn de connexions (~5-7/min) est une HYPOTHESE a mesurer,
      # pas une promesse.
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      TRACKER_TCP_PORT: 5023
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5023:5023"
    volumes:
      - tracky-api-logs:/app/apps/api/logs
      # Documentation du centre d'alerte, PUBLIEE hors du depot.
      #
      # L'image embarque deja `docs/centre-alerte` (cf. Dockerfile.api), mais une image est
      # figee : le rapport d'audit ecrit chaque nuit n'apparaitrait qu'au prochain rebuild.
      # Ce montage rend la publication independante du deploiement — deposer les fichiers
      # dans /opt/tracky-centre-alerte suffit, l'ecran les voit tout de suite.
      #
      # Dossier DEDIE, volontairement hors de /opt/vizyo-tracky : y ecrire directement
      # salirait l'arbre git du VPS et ferait echouer le prochain `git pull`.
      #
      # ⚠️ Si ce dossier n'existe pas, Docker le CREE VIDE et masque le contenu de l'image :
      # l'ecran afficherait une documentation vide sans rien expliquer. Le script de
      # publication doit donc toujours le creer avant de copier (cf. PROCEDURE-AUDIT.md §11).
      - /opt/tracky-centre-alerte:/app/docs/centre-alerte:ro
      # Documentation de l'audit VPS, meme raisonnement que ci-dessus : l'agent depose un
      # rapport chaque nuit, il doit apparaitre sans rebuild ni redemarrage.
      #
      # ⚠️ Meme piege : si /opt/tracky-vps-audit n'existe pas, Docker le CREE VIDE et masque
      # la copie embarquee dans l'image. Le script de publication cree donc le dossier avant
      # de copier (cf. docs/vps-audit/PROCEDURE-AUDIT.md).
      - /opt/tracky-vps-audit:/app/docs/vps-audit:ro
    networks:
      - vizyo-tracky
      - vizyo-auth-network
      - foodsqan-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Router API — capte /api/* et /realtime/* sur app-tracky
      - "traefik.http.routers.tracky-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.tracky-api.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.tracky-api.tls=true"
      - "traefik.http.routers.tracky-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.tracky-api.priority=10"
      - "traefik.http.services.tracky-api.loadbalancer.server.port=3000"
      # Headers pour WebSocket
      - "traefik.http.middlewares.tracky-api-ws.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Sprint 0.1 — le middleware ci-dessus etait DEFINI mais jamais ATTACHE au
      # routeur (X-Forwarded-Proto=https non applique -> backend voyait http).
      # On l'attache ici. A verifier au deploiement (pas de Traefik en local).
      - "traefik.http.routers.tracky-api.middlewares=tracky-api-ws"

    # Limite memoire (VPS-005) — usage observe 94 Mo ; Node peut pointer lors des rapports PDF et des appels IA
    deploy:
      resources:
        limits:
          memory: 1024m

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
    image: tracky-web:latest
    container_name: tracky-web
    restart: unless-stopped
    networks:
      - foodsqan-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Router Web — catch-all sur app-tracky (priorité plus basse que l'API)
      - "traefik.http.routers.tracky-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.tracky-web.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.tracky-web.tls=true"
      - "traefik.http.routers.tracky-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.tracky-web.priority=1"
      - "traefik.http.services.tracky-web.loadbalancer.server.port=80"
