server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/javascript text/html image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ancienne page unique -> nouvelle home (301 permanent)
    location = /vizyo-tracky.html { return 301 /; }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.docx$ {
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "no-cache";
    }
}
