server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ =404;
    }

    # Une seule URL canonique pour l'accueil, sans capturer la résolution interne de `/`.
    location = /index.html {
        if ($request_uri ~ "^/index\.html(?:\?.*)?$") {
            return 301 https://tracky.vizyoagency.com/;
        }
    }

    # Ancienne page unique -> nouvelle home (301 permanent)
    location = /vizyo-tracky.html { return 301 https://tracky.vizyoagency.com/; }

    # Ancienne page fiabilité (design précédent, retirée) -> page Sécurité
    location = /fiabilite-gps.html { return 301 https://tracky.vizyoagency.com/securite.html; }

    # Web manifest : bon type MIME (sinon servi en application/octet-stream)
    location = /site.webmanifest { default_type application/manifest+json; }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.docx$ {
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "no-cache";
    }
}
